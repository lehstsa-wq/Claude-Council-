    /* ── HISTORY SIDEBAR ────────────────────────────────────────────── */

    function HistorySidebar({ sessions, activeSessionId, isOpen, isMobile, onSelect, onNewCouncil, onToggle }) {
      const cls = isMobile
        ? `sidebar${isOpen ? " is-open-mobile" : " is-collapsed"}`
        : `sidebar${isOpen ? "" : " is-collapsed"}`;
      return (
        <aside className={cls} aria-label="Session history">
          <div className="sidebar__head">
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
              <span className="tag" style={{ color: "var(--t3)" }}>History</span>
              <button className="sidebar-toggle" onClick={onToggle} title="Hide sidebar">
                <i className="ti ti-layout-sidebar-left-collapse" style={{ fontSize: 14 }} />
              </button>
            </div>
            <button className="new-council-btn" onClick={onNewCouncil}>
              <i className="ti ti-plus" style={{ fontSize: 13 }} />New Council
            </button>
          </div>
          <div className="sidebar__scroll">
            {sessions.length === 0 ? (
              <div style={{ padding: "24px 10px", textAlign: "center" }}>
                <i className="ti ti-clock" style={{ fontSize: 22, color: "var(--t3)", display: "block", marginBottom: 10 }} />
                <p className="tag" style={{ color: "var(--t3)", fontSize: 9 }}>No sessions yet</p>
                <p style={{ fontSize: 11, color: "var(--t3)", marginTop: 6, lineHeight: 1.6 }}>Completed councils are<br />saved here automatically</p>
              </div>
            ) : sessions.map(s => (
              <div key={s.id} className={`session-card${activeSessionId === s.id ? " is-active" : ""}`} onClick={() => onSelect(s)} title={s.title}>
                <p className="session-card__title">{s.title}</p>
                <p className="session-card__time">
                  {relativeTime(s.timestamp)}
                  {s.turns && s.turns.length > 1 && <span style={{ marginLeft: 6, opacity: 0.7 }}>· {s.turns.length} turns</span>}
                </p>
              </div>
            ))}
          </div>
        </aside>
      );
    }

    /* ── API KEY SETUP ──────────────────────────────────────────────── */

    function ApiKeySetup({ onSave }) {
      const [key, setKey] = useState("");
      const [busy, setBusy] = useState(false);
      const [err, setErr]   = useState("");

      const submit = async () => {
        const k = key.trim();
        if (!k) return;
        setBusy(true); setErr("");
        try {
          const res  = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-api-key": k, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
            body: JSON.stringify({ model: "claude-haiku-4-5-20251001", max_tokens: 5, messages: [{ role: "user", content: "ping" }] }),
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          localStorage.setItem("council-key", k);
          onSave(k);
        } catch (e) { setErr(e.message || "Could not verify key."); }
        finally { setBusy(false); }
      };

      return (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100dvh", padding: 24 }}>
          <div className="fade-up" style={{ width: "100%", maxWidth: 440, background: "var(--bg2)", border: "1px solid var(--bd)", borderRadius: 12, padding: "40px 36px" }}>
            <p className="tag" style={{ color: "var(--amber)", marginBottom: 10 }}>Clearance required</p>
            <h1 style={{ fontFamily: "var(--display)", fontSize: 52, letterSpacing: 3, color: "var(--t1)", lineHeight: 1, marginBottom: 24 }}>THE COUNCIL</h1>
            <p style={{ fontSize: 13, color: "var(--t2)", lineHeight: 1.7, marginBottom: 28 }}>
              Five independent AI advisors. Anonymous peer review. One chairman's verdict.
              Your key stays in your browser and is sent only to Anthropic.
            </p>
            <label className="tag" style={{ display: "block", color: "var(--t3)", marginBottom: 8 }}>Anthropic API key</label>
            <input type="password" value={key} onChange={e => setKey(e.target.value)} onKeyDown={e => e.key === "Enter" && submit()} placeholder="sk-ant-..." autoFocus
              style={{ width: "100%", padding: "11px 14px", fontSize: 14, fontFamily: "var(--mono)", background: "var(--bg3)", border: "1px solid var(--bd2)", borderRadius: 6, color: "var(--t1)", outline: "none", marginBottom: 12 }} />
            {err && (
              <div style={{ fontSize: 12, color: "var(--red)", padding: "8px 12px", marginBottom: 12, background: "var(--red-tint)", border: "1px solid var(--red-ring)", borderRadius: 5 }}>
                <i className="ti ti-alert-triangle" style={{ marginRight: 6, fontSize: 12 }} />{err}
              </div>
            )}
            <button onClick={submit} disabled={!key.trim() || busy}
              style={{ width: "100%", padding: "12px 20px", fontFamily: "var(--display)", fontSize: 18, letterSpacing: 2, background: "var(--amber)", color: "var(--bg)", border: "none", borderRadius: 6, cursor: "pointer", opacity: (!key.trim() || busy) ? 0.35 : 1, transition: "opacity .15s" }}>
              {busy ? "VERIFYING…" : "ENTER THE COUNCIL"}
            </button>
            <p style={{ fontSize: 11, color: "var(--t3)", marginTop: 16, textAlign: "center" }}>
              Get your key at{" "}
              <a href="https://console.anthropic.com" target="_blank" rel="noopener noreferrer" style={{ color: "var(--amber)", textDecoration: "none" }}>console.anthropic.com</a>
            </p>
          </div>
        </div>
      );
    }

    /* ── MODE SELECTOR ─────────────────────────────────────────────── */

    function ModeSelector({ activeMode, onSelect }) {
      return (
        <div style={{ marginBottom: 20 }}>
          <p className="tag" style={{ color: "var(--t3)", marginBottom: 10 }}>Council mode</p>
          <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 2 }}>
            {Object.values(MODES).map(mode => (
              <button key={mode.id} onClick={() => onSelect(mode.id)}
                className={`mode-card${activeMode === mode.id ? " is-active" : ""}`}>
                <i className={`ti ${mode.icon}`} style={{ fontSize: 15, color: activeMode === mode.id ? "var(--amber)" : "var(--t3)", display: "block", marginBottom: 7 }} />
                <p style={{ fontSize: 12, fontWeight: 600, color: "var(--t1)", margin: "0 0 2px" }}>{mode.label}</p>
                <p style={{ fontSize: 10, color: "var(--t3)", fontFamily: "var(--mono)", letterSpacing: "0.3px", margin: 0 }}>{mode.tagline}</p>
              </button>
            ))}
          </div>
        </div>
      );
    }

    function TemplateRow({ mode, onSelect }) {
      const templates = TEMPLATES[mode] || [];
      if (!templates.length) return null;
      return (
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
          {templates.map((t, i) => (
            <button
              key={i}
              onClick={() => onSelect(t)}
              style={{
                padding: "5px 10px", fontSize: 11, borderRadius: 20,
                background: "var(--bg3)", border: "1px solid var(--bd)",
                color: "var(--t3)", cursor: "pointer",
                fontFamily: "var(--sans)", transition: "color .15s, border-color .15s",
                whiteSpace: "nowrap", overflow: "hidden",
                maxWidth: 240, textOverflow: "ellipsis",
              }}
            >
              {t.length > 40 ? t.slice(0, 40) + "…" : t}
            </button>
          ))}
        </div>
      );
    }

    /* ── SETTINGS PANEL ─────────────────────────────────────────────── */

    function SettingsPanel({ apiKey, model, onModel, fastAdvisors, onFast, advisorCount, onAdvisorCount, peerReviewEnabled, onPeerReview, generateDiagrams, onGenerateDiagrams, onBudgetMode, onClearKey, onClose, userContext, onUserContext }) {
      const estimatedCost = estimateCostPerTurn(model, fastAdvisors, advisorCount, peerReviewEnabled, generateDiagrams);
      const isBudgetMode  = model === FAST_MODEL && fastAdvisors && advisorCount <= 3 && !peerReviewEnabled;
      const isUnderPenny  = estimatedCost < 0.01;
      const costColor     = isUnderPenny ? "var(--green)" : estimatedCost < 0.02 ? "var(--amber)" : "var(--red)";
      const costLabel     = isUnderPenny ? "< 1¢ per turn" : `~${(estimatedCost * 100).toFixed(2)}¢ per turn`;

      // Reusable section header — larger and more legible than the old .tag labels
      const SectionLabel = ({ children }) => (
        <p style={{ fontSize: 11, fontWeight: 600, color: "var(--t2)", letterSpacing: "0.08em", textTransform: "uppercase", margin: "0 0 10px" }}>
          {children}
        </p>
      );

      // Reusable toggle row
      const Toggle = ({ on, label, sub, onClick, activeColor = "var(--green)", activeBg = "var(--green-tint)", activeBorder = "var(--green-ring)" }) => (
        <button onClick={onClick} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%", padding: "11px 14px", background: on ? activeBg : "var(--bg3)", border: `1px solid ${on ? activeBorder : "var(--bd)"}`, borderRadius: 7, cursor: "pointer", transition: "all .2s", textAlign: "left" }}>
          <div>
            <p style={{ fontSize: 13, fontWeight: 500, color: "var(--t1)", margin: "0 0 2px" }}>{label}</p>
            <p style={{ fontSize: 12, color: "var(--t2)", margin: 0 }}>{sub}</p>
          </div>
          <div style={{ width: 34, height: 19, borderRadius: 10, background: on ? activeColor : "var(--bg4)", border: `1px solid ${on ? activeColor : "var(--bd2)"}`, transition: "background .2s", position: "relative", flexShrink: 0 }}>
            <div style={{ position: "absolute", top: 2, left: on ? 16 : 2, width: 13, height: 13, borderRadius: "50%", background: "var(--t1)", boxShadow: "0 1px 3px oklch(0% 0 0 / 0.3)", transition: "left .2s" }} />
          </div>
        </button>
      );

      return (
        <>
          <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 90, background: "oklch(0% 0 0 / 0.55)" }} />
          <div className="fade-up" style={{ position: "fixed", top: 0, right: 0, bottom: 0, zIndex: 100, width: 320, background: "var(--bg2)", borderLeft: "1px solid var(--bd)", padding: "0", overflowY: "auto" }}>

            {/* Header */}
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "20px 20px 16px", borderBottom: "1px solid var(--bd)", position: "sticky", top: 0, background: "var(--bg2)", zIndex: 1 }}>
              <p style={{ fontSize: 15, fontWeight: 600, color: "var(--t1)", margin: 0 }}>Settings</p>
              <button onClick={onClose} style={{ display: "flex", alignItems: "center", justifyContent: "center", width: 28, height: 28, background: "var(--bg3)", border: "1px solid var(--bd)", borderRadius: 6, color: "var(--t2)", cursor: "pointer" }}>
                <i className="ti ti-x" style={{ fontSize: 14 }} />
              </button>
            </div>

            <div style={{ padding: "20px" }}>

              {/* ── Cost estimate ─────────────────────────────── */}
              <div style={{ padding: "14px 16px", marginBottom: 6, background: "var(--bg3)", border: `2px solid ${costColor}`, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <div>
                  <p style={{ fontSize: 13, fontWeight: 600, color: "var(--t1)", margin: "0 0 3px" }}>Estimated cost per turn</p>
                  <p style={{ fontSize: 12, color: "var(--t2)", margin: 0 }}>advisors · review · verdict{generateDiagrams ? " · diagram" : ""}</p>
                </div>
                <span style={{ fontFamily: "var(--mono)", fontSize: 16, fontWeight: 700, color: costColor }}>{costLabel}</span>
              </div>
              {!isUnderPenny && (
                <div style={{ padding: "9px 14px", marginBottom: 16, background: "var(--bg4)", border: `1px solid ${costColor}`, borderTop: "none", borderRadius: "0 0 8px 8px" }}>
                  <p style={{ fontSize: 12, color: "var(--t2)", margin: 0, lineHeight: 1.5 }}>
                    To reduce: {[
                      model !== FAST_MODEL && "switch to Haiku",
                      !fastAdvisors && "enable fast advisors",
                      advisorCount > 3 && `fewer advisors (now ${advisorCount})`,
                      peerReviewEnabled && "disable peer review",
                      generateDiagrams && "disable diagrams",
                    ].filter(Boolean).join(" · ") || "already optimized"}
                  </p>
                </div>
              )}
              {isUnderPenny && <div style={{ marginBottom: 16 }} />}

              {/* Budget mode preset */}
              <button onClick={onBudgetMode} style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", padding: "11px 14px", marginBottom: 24, background: isBudgetMode ? "var(--green-tint)" : "var(--bg3)", border: `1px solid ${isBudgetMode ? "var(--green-ring)" : "var(--bd)"}`, borderRadius: 7, cursor: "pointer", transition: "all .2s", textAlign: "left" }}>
                <i className="ti ti-currency-dollar" style={{ fontSize: 15, color: isBudgetMode ? "var(--green)" : "var(--t2)", flexShrink: 0 }} />
                <div style={{ flex: 1 }}>
                  <p style={{ fontSize: 13, fontWeight: 500, color: "var(--t1)", margin: "0 0 2px" }}>Budget mode</p>
                  <p style={{ fontSize: 12, color: "var(--t2)", margin: 0 }}>Haiku · 3 advisors · no peer review</p>
                </div>
                {isBudgetMode && <i className="ti ti-check" style={{ fontSize: 14, color: "var(--green)", flexShrink: 0 }} />}
              </button>

              {/* ── Model ─────────────────────────────────────── */}
              <div style={{ borderTop: "1px solid var(--bd)", paddingTop: 20, marginBottom: 24 }}>
                <SectionLabel>Chairman model</SectionLabel>
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  {MODELS.map(m => (
                    <button key={m.id} onClick={() => onModel(m.id)} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 14px", textAlign: "left", background: model === m.id ? "var(--amber-tint)" : "var(--bg3)", border: `1px solid ${model === m.id ? "var(--amber-ring)" : "var(--bd)"}`, borderRadius: 7, cursor: "pointer", transition: "all .15s" }}>
                      <div style={{ width: 7, height: 7, borderRadius: "50%", background: model === m.id ? "var(--amber)" : "var(--bd2)", flexShrink: 0, transition: "background .15s" }} />
                      <div style={{ flex: 1 }}>
                        <p style={{ fontSize: 13, fontWeight: 500, color: "var(--t1)", margin: "0 0 2px" }}>{m.label}</p>
                        <p style={{ fontSize: 12, color: "var(--t2)", margin: 0 }}>{m.sub}</p>
                      </div>
                      {model === m.id && <i className="ti ti-check" style={{ fontSize: 13, color: "var(--amber)" }} />}
                    </button>
                  ))}
                </div>
              </div>

              {/* ── Pipeline ──────────────────────────────────── */}
              <div style={{ borderTop: "1px solid var(--bd)", paddingTop: 20, marginBottom: 24 }}>
                <SectionLabel>Pipeline</SectionLabel>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  <Toggle
                    on={fastAdvisors} label="Fast advisors" onClick={() => onFast(!fastAdvisors)}
                    sub={fastAdvisors ? "Advisors on Haiku · verdict on selected model" : "All phases on selected model"}
                  />
                  <Toggle
                    on={peerReviewEnabled} label="Peer review" onClick={() => onPeerReview(!peerReviewEnabled)}
                    sub={peerReviewEnabled ? "Blind cross-examination before synthesis" : "Skipped — saves one API call"}
                  />
                </div>

                {/* Advisor count */}
                <div style={{ marginTop: 16 }}>
                  <p style={{ fontSize: 12, fontWeight: 500, color: "var(--t2)", margin: "0 0 8px" }}>
                    Advisors: <span style={{ color: "var(--t1)", fontWeight: 600 }}>{advisorCount}</span>
                    <span style={{ color: "var(--t2)", fontWeight: 400, marginLeft: 8 }}>
                      {advisorCount === 5 ? "Full depth" : advisorCount === 4 ? "High depth" : advisorCount === 3 ? "Balanced" : "Lean"}
                    </span>
                  </p>
                  <div style={{ display: "flex", background: "var(--bg3)", border: "1px solid var(--bd)", borderRadius: 7, overflow: "hidden" }}>
                    {[2, 3, 4, 5].map(n => (
                      <button key={n} onClick={() => onAdvisorCount(n)} style={{ flex: 1, padding: "9px 0", fontSize: 13, fontWeight: 500, background: advisorCount === n ? "var(--amber-tint)" : "transparent", color: advisorCount === n ? "var(--amber)" : "var(--t2)", border: "none", borderRight: n < 5 ? "1px solid var(--bd)" : "none", cursor: "pointer", transition: "background .15s" }}>
                        {n}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* ── Output ────────────────────────────────────── */}
              <div style={{ borderTop: "1px solid var(--bd)", paddingTop: 20, marginBottom: 24 }}>
                <SectionLabel>Output</SectionLabel>
                <Toggle
                  on={generateDiagrams} label="Supporting diagrams" onClick={() => onGenerateDiagrams(!generateDiagrams)}
                  sub={generateDiagrams ? "Mermaid diagram appended to verdict" : "Verdict text only"}
                  activeColor="var(--blue)" activeBg="var(--blue-tint)" activeBorder="var(--blue-ring)"
                />
              </div>

              {/* ── My Context ────────────────────────────────── */}
              <div style={{ borderTop: "1px solid var(--bd)", paddingTop: 20, marginBottom: 24 }}>
                <SectionLabel>My context</SectionLabel>
                <textarea
                  value={userContext}
                  onChange={e => {
                    onUserContext(e.target.value);
                    localStorage.setItem("council-user-context", e.target.value);
                  }}
                  placeholder="Tell the council who you are. Role, background, priorities, constraints, communication preferences. Sent with every session."
                  style={{
                    width: "100%", padding: "10px 12px", marginBottom: 6,
                    background: "var(--bg3)", border: "1px solid var(--bd)",
                    borderRadius: 6, color: "var(--t1)", fontSize: 12,
                    lineHeight: 1.65, resize: "vertical", minHeight: 80,
                    fontFamily: "var(--sans)", outline: "none",
                  }}
                />
                <p style={{ fontSize: 11, color: "var(--t3)", margin: 0 }}>
                  Stored in your browser. Cached by Anthropic for cost efficiency on repeated use.
                </p>
              </div>

              {/* ── Account ───────────────────────────────────── */}
              <div style={{ borderTop: "1px solid var(--bd)", paddingTop: 20 }}>
                <SectionLabel>API Key</SectionLabel>
                <div style={{ padding: "10px 14px", marginBottom: 10, background: "var(--bg3)", border: "1px solid var(--bd)", borderRadius: 7 }}>
                  <p style={{ fontSize: 12, fontFamily: "var(--mono)", color: "var(--t2)", margin: 0, wordBreak: "break-all" }}>{apiKey.slice(0, 14)}{"•".repeat(16)}</p>
                </div>
                <button onClick={onClearKey} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, color: "var(--red)", background: "none", border: "1px solid var(--red-ring)", padding: "8px 14px", borderRadius: 6, cursor: "pointer", transition: "opacity .15s" }}>
                  <i className="ti ti-trash" style={{ fontSize: 13 }} />Remove key
                </button>
              </div>

            </div>
          </div>
        </>
      );
    }

    /* ── PHASE STEPPER ──────────────────────────────────────────────── */

    function PhaseStepper({ phase, showReview = true, advisorsDone = 0, advisorsTotal = 5 }) {
      const advisorLabel = phase === "advisors" ? `Advisors (${advisorsDone}/${advisorsTotal})` : "Advisors";
      const allSteps = [{ id: "advisors", label: advisorLabel }, { id: "review", label: "Peer review" }, { id: "synthesis", label: "Chairman" }];
      const steps    = showReview ? allSteps : allSteps.filter(s => s.id !== "review");
      const activeIdx = steps.findIndex(s => s.id === phase);
      return (
        <div style={{ display: "flex", alignItems: "center", padding: "16px 20px", marginBottom: 20, background: "var(--bg2)", border: "1px solid var(--bd)", borderRadius: 8 }}>
          {steps.map(({ id, label }, i) => {
            const isDone = i < activeIdx, isLive = i === activeIdx;
            return (
              <React.Fragment key={id}>
                <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 7 }}>
                  <div style={{ width: 28, height: 28, borderRadius: "50%", border: `2px solid ${isDone ? "var(--green)" : isLive ? "var(--amber)" : "var(--bd2)"}`, background: isDone ? "var(--green)" : isLive ? "var(--amber-tint)" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", transition: "all .4s" }}>
                    {isDone ? <i className="ti ti-check" style={{ fontSize: 12, color: "var(--bg)" }} />
                      : isLive ? <div className="spin" style={{ width: 11, height: 11, border: "1.5px solid var(--bd)", borderTopColor: "var(--amber)", borderRadius: "50%" }} />
                      : <div style={{ width: 6, height: 6, borderRadius: "50%", background: "var(--bd2)" }} />}
                  </div>
                  <span className="tag" style={{ fontSize: 9, color: isLive ? "var(--amber)" : isDone ? "var(--green)" : "var(--t3)", whiteSpace: "nowrap" }}>{label}</span>
                </div>
                {i < 2 && <div style={{ flex: 1, height: 1, margin: "0 8px 14px", background: isDone ? "var(--green)" : "var(--bd)", transition: "background .4s" }} />}
              </React.Fragment>
            );
          })}
        </div>
      );
    }

    /* ── ADVISOR ROW (live streaming) ───────────────────────────────── */

    function AdvisorRow({ advisor, live, done, phase, isSpotlit = true }) {
      return (
        <div style={{ padding: "13px 16px", background: done ? "var(--green-tint)" : "var(--bg2)", border: `1px solid ${done ? "var(--green-ring)" : "var(--bd)"}`, borderRadius: 7, marginBottom: 5, transition: "background .3s, border-color .3s, opacity .2s", opacity: done || isSpotlit ? 1 : 0.55 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: live ? 8 : 0 }}>
            {done
              ? <i className="ti ti-check" style={{ fontSize: 13, color: "var(--green)", flexShrink: 0 }} />
              : <i className={`ti ${advisor.icon} pulse`} style={{ fontSize: 13, color: advisor.accent, flexShrink: 0 }} />}
            <div style={{ flex: 1, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              <span style={{ fontSize: 13, fontWeight: 500, color: "var(--t1)" }}>{advisor.name}</span>
              <span className="tag" style={{ color: "var(--t3)", fontSize: 9 }}>{advisor.tagline}</span>
            </div>
            <span className="tag" style={{ fontSize: 9, color: done ? "var(--green)" : "var(--t3)" }}>
              {done ? (phase === "review" ? "reviewed" : "responded") : (phase === "review" ? "reviewing…" : "deliberating…")}
            </span>
          </div>
          {live && (
            <div style={{ fontSize: 12, lineHeight: 1.7, color: "var(--t2)", maxHeight: 60, overflow: "hidden", maskImage: "linear-gradient(to bottom, black 40%, transparent 100%)", WebkitMaskImage: "linear-gradient(to bottom, black 40%, transparent 100%)" }}>
              {live}{!done && <span style={{ animation: "blink .7s step-end infinite", color: advisor.accent }}>▋</span>}
            </div>
          )}
        </div>
      );
    }

    /* ── ACCORDION ──────────────────────────────────────────────────── */

    function Accordion({ label, sub, accent, tint, ring, isOpen, onToggle, children }) {
      return (
        <div style={{ border: `1px solid ${isOpen ? ring : "var(--bd)"}`, borderRadius: 7, overflow: "hidden", transition: "border-color .2s", marginBottom: 5, background: isOpen ? tint : "transparent" }}>
          <button onClick={onToggle} style={{ display: "flex", alignItems: "center", gap: 12, width: "100%", padding: "12px 16px", background: "none", border: "none", cursor: "pointer", textAlign: "left" }}>
            <div style={{ width: 6, height: 6, borderRadius: "50%", flexShrink: 0, background: isOpen ? accent : "var(--bd2)", transition: "background .2s" }} />
            <span style={{ fontSize: 13, fontWeight: 500, color: "var(--t1)", flex: 1 }}>{label}</span>
            <span className="tag" style={{ color: "var(--t3)", marginRight: 8, fontSize: 9 }}>{sub}</span>
            <i className={`ti ti-chevron-${isOpen ? "up" : "down"}`} style={{ fontSize: 13, color: "var(--t3)" }} />
          </button>
          {isOpen && (
            <div className="fade-up" style={{ padding: "4px 18px 18px 32px", borderTop: "1px solid var(--bd)" }}>
              <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 4 }}>
                <CopyBtn text={typeof children === "string" ? children : ""} />
              </div>
              <Md text={typeof children === "string" ? children : ""} />
            </div>
          )}
        </div>
      );
    }

    /* ── VERDICT SECTION ────────────────────────────────────────────── */

    function VerdictSection({ label, icon, accent, tint, ring, text }) {
      if (!text) return null;
      return (
        <div style={{ marginBottom: 14 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <i className={`ti ${icon}`} style={{ fontSize: 13, color: accent }} />
              <span className="tag" style={{ color: accent, fontSize: 10 }}>{label}</span>
            </div>
            <CopyBtn text={text} />
          </div>
          <div style={{ padding: "16px 18px", background: tint, border: `1px solid ${ring}`, borderRadius: 8 }}>
            <Md text={text} />
          </div>
        </div>
      );
    }

    function detectConsensus(verdictText) {
      const splitSignals = ["disagree", "clash", "contrast", "split", "diverge", "opposite", "however", "but"];
      const alignSignals = ["agree", "consensus", "consistent", "all", "unanimous", "align"];
      const text       = (verdictText || "").toLowerCase();
      const splitScore = splitSignals.filter(w => text.includes(w)).length;
      const alignScore = alignSignals.filter(w => text.includes(w)).length;
      if (splitScore >= 3) return { label: "Council divided",  color: "var(--red)",   tint: "var(--red-tint)",   ring: "var(--red-ring)",   icon: "ti-arrows-right-left" };
      if (alignScore >= 3) return { label: "Strong consensus", color: "var(--green)", tint: "var(--green-tint)", ring: "var(--green-ring)", icon: "ti-check" };
      return               { label: "Mixed views",             color: "var(--amber)", tint: "var(--amber-tint)", ring: "var(--amber-ring)", icon: "ti-wave-sine" };
    }

    /* ── VERDICT TABS ───────────────────────────────────────────────── */

    function VerdictTabs({ sec, diagramCode }) {
      const allTabs = [
        { id: "agrees",  label: "Agrees",        icon: "ti-check",              accent: "var(--green)",  tint: "var(--green-tint)",  ring: "var(--green-ring)",  text: sec.agrees  },
        { id: "clashes", label: "Clashes",        icon: "ti-arrows-exchange",    accent: "var(--red)",    tint: "var(--red-tint)",    ring: "var(--red-ring)",    text: sec.clashes },
        { id: "blind",   label: "Blind Spots",    icon: "ti-eye-off",            accent: "var(--purple)", tint: "var(--purple-tint)", ring: "var(--purple-ring)", text: sec.blind   },
        { id: "rec",     label: "Recommendation", icon: "ti-star",               accent: "var(--amber)",  tint: "var(--amber-tint)",  ring: "var(--amber-ring)",  text: sec.rec     },
        { id: "first",   label: "One Thing",      icon: "ti-arrow-narrow-right", accent: "var(--amber)",  tint: "var(--amber-tint)",  ring: "var(--amber-ring)",  text: sec.first   },
      ].filter(t => t.text);
      if (diagramCode) allTabs.push({ id: "diagram", label: "Diagram", icon: "ti-chart-dots-3", accent: "var(--blue)", tint: "var(--blue-tint)", ring: "var(--blue-ring)", text: null });

      const [activeTab, setActiveTab] = useState(() => allTabs.find(t => t.id === "rec")?.id || allTabs[0]?.id || "rec");
      const tab = allTabs.find(t => t.id === activeTab) || allTabs[0];
      if (!tab) return null;

      return (
        <div style={{ marginBottom: 28 }}>
          <div className="verdict-tab-bar">
            {allTabs.map(t => (
              <button key={t.id} className="verdict-tab" onClick={() => setActiveTab(t.id)}
                style={{ color: activeTab === t.id ? t.accent : "var(--t3)", borderBottomColor: activeTab === t.id ? t.accent : "transparent" }}>
                <i className={`ti ${t.icon}`} style={{ fontSize: 11 }} />
                {t.label}
              </button>
            ))}
          </div>

          <div className="fade-up" key={activeTab}>
            {activeTab === "diagram" ? (
              <MermaidDiagram code={diagramCode} />
            ) : activeTab === "first" ? (
              <div>
                <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 6 }}>
                  <CopyBtn text={tab.text} />
                </div>
                <div className="first-action-item">
                  <Md text={tab.text} />
                </div>
              </div>
            ) : (
              <div>
                <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 6 }}>
                  <CopyBtn text={tab.text} />
                </div>
                <div style={{ padding: "16px 18px", background: tab.tint, border: `1px solid ${tab.ring}`, borderRadius: 8 }}>
                  <Md text={tab.text} />
                </div>
              </div>
            )}
            {sec.raw && (
              <div style={{ padding: "18px 20px", marginTop: 12, background: "var(--bg2)", border: "1px solid var(--bd)", borderRadius: 8 }}>
                <Md text={sec.raw} />
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ── TURN CARD ──────────────────────────────────────────────────────
       Renders a single completed council turn. Handles its own accordion
       open/close state via a turn-scoped key prefix so multiple turns in a
       thread don't share accordion state with each other.                   */
    function TurnCard({ turn, turnIndex, openPanels, onTogglePanel }) {
      const sec    = useMemo(() => turn.verdict ? parseVerdict(turn.verdict) : null, [turn.verdict]);
      const prefix = `t${turnIndex}`; // namespace all panel keys by turn index

      if (!sec) return null;

      return (
        <div className="fade-up" style={{ marginBottom: 0 }}>

          {/* Turn separator — only shown for follow-up turns (not the first) */}
          {turnIndex > 0 && (
            <div style={{ display: "flex", alignItems: "center", gap: 12, margin: "36px 0 24px" }}>
              <div style={{ flex: 1, height: 1, background: "var(--bd)" }} />
              <span className="tag" style={{ color: "var(--t3)", fontSize: 9, flexShrink: 0 }}>Follow-up · Turn {turnIndex + 1}</span>
              <div style={{ flex: 1, height: 1, background: "var(--bd)" }} />
            </div>
          )}

          {/* User's question echo */}
          <div style={{ padding: "14px 18px", marginBottom: 24, background: "var(--bg2)", border: "1px solid var(--bd)", borderLeft: "3px solid var(--amber)", borderRadius: "0 8px 8px 0", display: "flex", gap: 10, alignItems: "flex-start" }}>
            <div style={{ flex: 1 }}>
              <p className="tag" style={{ color: "var(--amber)", marginBottom: 6 }}>
                {turnIndex === 0 ? "Session question" : "Follow-up question"}
              </p>
              <p style={{ fontSize: 14, color: "var(--t2)", lineHeight: 1.65, fontStyle: "italic", margin: 0 }}>"{turn.prompt}"</p>
            </div>
            <CopyBtn text={turn.prompt} style={{ flexShrink: 0, marginTop: 2 }} />
          </div>

          <Divider label="Chairman's verdict" />

          {(() => {
            const signal = detectConsensus(turn.verdict);
            return (
              <div style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "5px 12px", marginBottom: 20, background: signal.tint, border: `1px solid ${signal.ring}`, borderRadius: 20 }}>
                <i className={`ti ${signal.icon}`} style={{ fontSize: 12, color: signal.color }} />
                <span className="tag" style={{ color: signal.color, fontSize: 9 }}>{signal.label}</span>
              </div>
            );
          })()}
          <VerdictTabs sec={sec} diagramCode={turn.diagramCode} />

          <Divider label="Full transcripts" />

          <p className="tag" style={{ color: "var(--t3)", marginBottom: 8 }}>Advisor responses</p>
          <div style={{ marginBottom: 16 }}>
            {Object.entries(turn.advisorTexts).map(([id, txt]) => {
              const allAdvisors = Object.values(MODES).flatMap(m => m.advisors);
              const a = allAdvisors.find(x => x.id === id) || { id, name: id, tagline: "", accent: "var(--t3)", tint: "var(--bg3)", ring: "var(--bd)" };
              return (
                <Accordion key={id} label={a.name} sub={a.tagline} accent={a.accent} tint={a.tint} ring={a.ring}
                  isOpen={!!openPanels[`${prefix}-${id}`]}
                  onToggle={() => onTogglePanel(`${prefix}-${id}`)}>
                  {txt}
                </Accordion>
              );
            })}
          </div>
          {turn.peerReview && (
            <Accordion label="Consolidated peer review" sub="cross-examination" accent="var(--purple)" tint="var(--purple-tint)" ring="var(--purple-ring)"
              isOpen={!!openPanels[`${prefix}-rev`]}
              onToggle={() => onTogglePanel(`${prefix}-rev`)}>
              {turn.peerReview}
            </Accordion>
          )}
        </div>
      );
    }

    /* ── CONVERSATION THREAD ────────────────────────────────────────────
       Renders all completed turns and auto-scrolls to the newest turn
       whenever the turns array grows (i.e., after a follow-up completes).   */
    function ConversationThread({ turns, openPanels, onTogglePanel }) {
      const bottomAnchorRef = useRef(null);

      useEffect(() => {
        bottomAnchorRef.current?.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }, [turns.length]);

      return (
        <div className="conversation-thread">
          {turns.map((turn, idx) => (
            <TurnCard
              key={idx}
              turn={turn}
              turnIndex={idx}
              openPanels={openPanels}
              onTogglePanel={onTogglePanel}
            />
          ))}
          <div ref={bottomAnchorRef} />
        </div>
      );
    }

    /* ── DIAGRAM TOGGLE ─────────────────────────────────────────────── */

    function DiagramToggle({ enabled, onToggle }) {
      return (
        <button
          className={`diagram-toggle ${enabled ? "is-on" : "is-off"}`}
          onClick={onToggle}
          title={enabled ? "Disable diagram generation" : "Request a supporting diagram from the Chairman"}
        >
          <i className="ti ti-chart-dots-3" style={{ fontSize: 13 }} />
          {enabled ? "Diagrams on" : "Diagrams"}
        </button>
      );
    }

    /* ── COUNCIL (MAIN) ─────────────────────────────────────────────── */

    function Council({ apiKey, onClearKey }) {

      // ── Conversation thread state ────────────────────────────────────
      // `turns` holds all completed turns for the current session.
      // New turns are appended; loading a historical session hydrates this directly.
      const [turns,             setTurns]             = useState([]);
      const [activeDbSessionId, setActiveDbSessionId] = useState(null);

      // ── Per-turn ephemeral streaming state ───────────────────────────
      // These reset at the start of each new turn and hold live output.
      const [phase,        setPhase]        = useState("idle");
      const [live,         setLive]         = useState({});
      const [liveRev,      setLiveRev]      = useState("");
      const [liveVerdict,  setLiveVerdict]  = useState("");
      const [advisorDone,  setAdvisorDone]  = useState({});
      const [error,        setError]        = useState(null);

      // ── Input values ─────────────────────────────────────────────────
      const [initialQuestion, setInitialQuestion] = useState(""); // first-turn textarea
      const [followUpInput,   setFollowUpInput]   = useState(""); // follow-up textarea

      // ── User preferences (localStorage-persisted) ────────────────────
      const [model,              setModel]              = useState(() => localStorage.getItem("council-model") || MODELS[1].id);
      const [fastAdvisors,       setFastAdvisors]       = useState(() => localStorage.getItem("council-fast") !== "false");
      const [advisorCount,       setAdvisorCount]       = useState(() => parseInt(localStorage.getItem("council-advisors") || "5"));
      const [peerReviewEnabled,  setPeerReviewEnabled]  = useState(() => localStorage.getItem("council-review") !== "false");
      const [generateDiagrams,   setGenerateDiagrams]   = useState(false);
      const [showSettings,       setShowSettings]       = useState(false);
      const [activeMode,         setActiveMode]         = useState("decision");
      const [contextInput,       setContextInput]       = useState("");
      const [showContextPanel,   setShowContextPanel]   = useState(false);
      const [userContext,        setUserContext]        = useState(() => localStorage.getItem("council-user-context") || "");

      const currentMode        = MODES[activeMode] || MODES.decision;
      const modeAdvisors       = currentMode.advisors;
      const activeChairmanSystem = currentMode.chairmanSystem;

      const [selectedAdvisors, setSelectedAdvisors] = useState(() => {
        try {
          const saved = localStorage.getItem("council-selected-advisors");
          return saved ? JSON.parse(saved) : ADVISORS.map(a => a.id);
        } catch { return ADVISORS.map(a => a.id); }
      });

      useEffect(() => {
        localStorage.setItem("council-selected-advisors", JSON.stringify(selectedAdvisors));
      }, [selectedAdvisors]);

      const activeAdvisors = useMemo(
        () => ADVISORS.filter(a => selectedAdvisors.includes(a.id)),
        [selectedAdvisors]
      );
      const safeAdvisors = activeAdvisors.length >= 2 ? activeAdvisors : ADVISORS.slice(0, 2);

      // ── Mobile detection ─────────────────────────────────────────────
      const isMobile = typeof window !== "undefined" && window.innerWidth < 768;

      // ── Sidebar state ────────────────────────────────────────────────
      const [sidebarOpen,     setSidebarOpen]     = useState(!isMobile);
      const [sessions,        setSessions]        = useState([]);
      const [activeSessionId, setActiveSessionId] = useState(null);

      // ── Accordion open/close per panel across all turns ──────────────
      const [openPanels, setOpenPanels] = useState({});

      // ── UI state ──────────────────────────────────────────────────────
      const [showOptions,       setShowOptions]       = useState(false);
      const [showFollowUpInput, setShowFollowUpInput] = useState(false);
      const [spotlitAdvisor,    setSpotlitAdvisor]    = useState(null);

      // ── File attachments ──────────────────────────────────────────────
      const [attachedFiles, setAttachedFiles] = useState([]);
      const addFiles   = useCallback(items => setAttachedFiles(prev => [...prev, ...items]), []);
      const removeFile = useCallback(id    => setAttachedFiles(prev => prev.filter(f => f.id !== id)), []);

      // Phases 1+2 use the cheap Haiku model; Phase 3 uses the quality model.
      const advisorModel = fastAdvisors ? FAST_MODEL : model;
      const isProcessing = ["advisors", "review", "synthesis"].includes(phase);

      const togglePanel = useCallback(k => setOpenPanels(p => ({ ...p, [k]: !p[k] })), []);
      const modelLabel  = m => MODELS.find(x => x.id === m)?.label ?? m;

      useEffect(() => { localStorage.setItem("council-model",    model); }, [model]);
      useEffect(() => { localStorage.setItem("council-fast",     fastAdvisors); }, [fastAdvisors]);
      useEffect(() => { localStorage.setItem("council-advisors", advisorCount); }, [advisorCount]);
      useEffect(() => { localStorage.setItem("council-review",   peerReviewEnabled); }, [peerReviewEnabled]);

      // ── Load session list from IndexedDB on mount ────────────────────
      const refreshSessionList = useCallback(async () => {
        try {
          const all = await db.sessions.orderBy("timestamp").reverse().toArray();
          setSessions(all);
        } catch (e) { console.warn("History load failed:", e); }
      }, []);

      useEffect(() => { refreshSessionList(); }, [refreshSessionList]);

      // ── Hydrate React state from a stored session ────────────────────
      // This replays a complete thread without any API call by restoring the
      // saved turns array directly into state. The user can then add follow-ups.
      const handleSelectSession = useCallback((session) => {
        const savedMode = session.turns?.[0]?.mode || "decision";
        setTurns(session.turns || []);
        setActiveMode(savedMode);
        setActiveDbSessionId(session.id);
        setActiveSessionId(session.id);
        setPhase("conversation");
        setFollowUpInput("");
        setOpenPanels({});
        setError(null);
        setLive({}); setLiveRev(""); setLiveVerdict(""); setAdvisorDone({});
        if (isMobile) setSidebarOpen(false);
      }, [isMobile]);

      // ── Reset to a blank canvas ──────────────────────────────────────
      const handleNewCouncil = useCallback(() => {
        setTurns([]);
        setInitialQuestion("");
        setFollowUpInput("");
        setPhase("idle");
        setActiveDbSessionId(null);
        setActiveSessionId(null);
        setOpenPanels({});
        setError(null);
        setShowFollowUpInput(false);
        setSpotlitAdvisor(null);
        setAttachedFiles([]);
        setLive({}); setLiveRev(""); setLiveVerdict(""); setAdvisorDone({});
      }, []);

      // ── Core pipeline: executes one full council turn ────────────────
      // Accepts the new prompt and all prior completed turns. The prior turns
      // are serialized into a cached prefix block so each new turn costs only
      // the delta in tokens rather than re-encoding the full thread history.
      const executeCouncilTurn = useCallback(async (newPrompt, priorTurns, runAdvisors, runAttachedFiles) => {
        const priorContext = buildSessionContext(userContext, priorTurns);
        const userMsg = contextInput.trim()
          ? `BACKGROUND MATERIAL:\n${contextInput.trim()}\n\n---\n\nQUESTION / TASK:\n${newPrompt}`
          : newPrompt;

        const baseQuestion = priorContext
          ? `Prior context above. Follow-up question: ${userMsg}\n\nBuild only on what's new — no repetition. Name specific things.`
          : activeMode === "decision"
            ? `Question for the council:\n\n---\n${userMsg}\n---\n\nName specific things — failure modes, opportunities, actions, contradictions. No generic advice.`
            : `Input for review:\n\n---\n${userMsg}\n---\n\nReview it through your specific lens. Be specific and direct.`;

        setPhase("advisors");
        setLive({}); setAdvisorDone({});
        const collectedTexts = {};
        const activeAdvisors = runAdvisors;
        const filesForTurn   = runAttachedFiles || [];

        await Promise.all(activeAdvisors.map(advisor => {
          const advSystem      = advisor.system || SHARED_ADVISOR_SYSTEM;
          const advisorPrompt  = advisor.lens ? `Your lens: ${advisor.lens}\n\n${baseQuestion}` : baseQuestion;
          const advisorContent = buildUserMessageWithFiles(advisorPrompt, filesForTurn);
          return collect(
            advSystem,
            advisorContent,
            apiKey, advisorModel,
            full => {
              collectedTexts[advisor.id] = full;
              setLive(p => ({ ...p, [advisor.id]: full }));
              setSpotlitAdvisor(advisor.id);
            },
            priorContext,
            TOKEN_BUDGETS.advisor
          ).then(() => setAdvisorDone(p => ({ ...p, [advisor.id]: true })));
        }));
        setSpotlitAdvisor(null);

        /* Phase 2: Consolidated peer review (optional) ────────────────
           Skipped entirely when peerReviewEnabled is false — eliminates one
           full API call. When running, uses the same snippet compression as
           the chairman so the anonymous block doesn't balloon with full texts. */
        let peerReviewText = "";
        if (peerReviewEnabled) {
          setPhase("review");
          setLiveRev("");
          const shuffledAdvisors  = [...activeAdvisors].sort(() => Math.random() - 0.5);
          const letterMap         = Object.fromEntries(shuffledAdvisors.map((a, i) => [String.fromCharCode(65 + i), a.id]));
          const snippetCharsReview = ADVISOR_SNIPPET_CHARS[advisorModel] ?? ADVISOR_SNIPPET_CHARS.default;
          const anonymousBlock    = Object.entries(letterMap).map(([l, id]) => {
            const txt = collectedTexts[id] || "";
            return `**Advisor ${l}:** ${txt.length > snippetCharsReview ? txt.slice(0, snippetCharsReview) + "…" : txt}`;
          }).join("\n");
          const reviewCachePrefix = priorContext ? `${priorContext}\n\n${anonymousBlock}` : anonymousBlock;

          const reviewPrompt  = `Question: "${newPrompt}"\n\n1. Which advisor's logic is most sound? (letter + one sentence why)\n2. Which advisor made an unsupported leap or factual error? (letter + what specifically)\n3. What is the single most important thing none of them addressed?\n4. What is the key tension the Chairman must explicitly resolve?\n\nBe specific. Identify errors, not just gaps.`;
          const reviewContent = buildUserMessageWithFiles(reviewPrompt, filesForTurn);
          peerReviewText = await collect(
            "You are an impartial Council Analyst. Your job is to find errors in reasoning, not just missing topics. Be precise and critical. No preamble.",
            reviewContent,
            apiKey, advisorModel,
            full => setLiveRev(full),
            reviewCachePrefix,
            TOKEN_BUDGETS.review
          );
        }

        /* Phase 3: Chairman synthesis ─────────────────────────────────
           For Haiku the full advisor block is cheap so we pass it all.
           For Sonnet/Opus the advisor block is expensive — we compress
           each advisor to a 180-char snippet (~25 tokens). The peer review
           already captures the key contrasts, so the chairman still has
           enough signal without paying for the full transcripts.           */
        setPhase("synthesis");
        setLiveVerdict("");
        const snippetChars   = ADVISOR_SNIPPET_CHARS[model] ?? ADVISOR_SNIPPET_CHARS.default;
        const chairmanAdvisorBlock = activeAdvisors.map(a => {
          const text = collectedTexts[a.id] || "";
          const snippet = text.length > snippetChars ? text.slice(0, snippetChars) + "…" : text;
          return `**${a.name}:** ${snippet}`;
        }).join("\n");
        const chairmanTokenBudget = model === FAST_MODEL ? TOKEN_BUDGETS.chairmanHaiku : TOKEN_BUDGETS.chairmanPremium;
        const fullTranscript = `${priorContext ? priorContext + "\n\n---\n\n" : ""}CURRENT QUESTION:\n${userMsg}\n\nADVISOR RESPONSES:\n${chairmanAdvisorBlock}\n\nPEER REVIEW:\n${peerReviewText}`;

        // When diagrams are enabled the instruction is mandatory — the model MUST
        // produce a diagram. The "Only include if…" hedge is intentionally absent
        // because the user has explicitly requested visual output.
        const diagramInstruction = generateDiagrams
          ? `\n\nREQUIRED: You MUST append exactly one Mermaid.js diagram at the very end of your response. This is mandatory. Use this exact format:\n\n\`\`\`mermaid\n[your diagram here]\n\`\`\`\n\nChoose the diagram type that best represents the decision structure: flowchart for decisions/processes, graph LR for relationships, sequenceDiagram for timelines, mindmap for hierarchies. The diagram must directly visualize the core recommendation.`
          : "";

        // The Recommendation section explicitly invites full plans and
        // step-by-step instructions — "do not compress for brevity" removes the
        // implicit length pressure that was truncating actionable content.
        // The other sections stay sharp and position-taking; only the
        // Recommendation expands to match the depth the question warrants.
        const synthesisPrompt = `Produce an in-depth, actionable verdict using exactly these five section headers. Name things. Take positions. Commit to claims.\n\n## Where the Council Agrees\nState the consensus as a concrete claim. Say in one sentence whether that consensus is correct or dangerously incomplete.\n\n## Where the Council Clashes\nName the specific disagreement. Take a side — say which advisor is right and exactly why. Resolve the tension; do not present both sides neutrally.\n\n## Blind Spots the Council Caught\nName the single most important insight from the peer review that changes the picture.\n\n## The Recommendation\nProduce a complete, detailed recommendation. Include step-by-step instructions, a phased plan, or a decision framework — whatever the complexity of the question demands. Name specific actions, owners, sequencing, and trade-offs. Do not compress for brevity. If the question requires a full plan, write the full plan.\n\n## The One Thing to Do First\nThe single highest-leverage first action. Two to three sentences: what to do, why it unlocks everything else, and what done looks like.${diagramInstruction}`;

        const synthesisUserMsg = activeMode === "decision"
          ? synthesisPrompt
          : "Synthesize the advisor feedback above into your structured verdict. Follow the format defined in your instructions exactly.";
        const chairmanContent = buildUserMessageWithFiles(synthesisUserMsg, filesForTurn);
        const rawVerdict = await collect(
          activeChairmanSystem, chairmanContent, apiKey, model,
          full => setLiveVerdict(full),
          fullTranscript, // large cached block — grows cheaply with thread length
          chairmanTokenBudget
        );

        const { verdictText, diagramCode } = splitVerdictAndDiagram(rawVerdict);

        return { prompt: newPrompt, mode: activeMode, advisorTexts: collectedTexts, peerReview: peerReviewText, verdict: verdictText, diagramCode };
      }, [apiKey, model, advisorModel, peerReviewEnabled, generateDiagrams, activeMode, activeChairmanSystem, contextInput, userContext]);

      // ── Unified turn runner ──────────────────────────────────────────
      // Handles both the first turn (creates a new DB session) and follow-up
      // turns (appends to the existing DB session). The distinction is whether
      // `turns` is empty when the run begins.
      const runTurn = useCallback(async (newPrompt) => {
        if (!newPrompt.trim() || isProcessing) return;
        setError(null);
        setShowFollowUpInput(false);
        const priorTurns       = turns;          // snapshot at dispatch time
        const runAdvisors      = activeMode === "decision" ? safeAdvisors : modeAdvisors.slice(0, advisorCount);
        const runAttachedFiles = attachedFiles;  // snapshot files at dispatch time

        try {
          const completedTurn = await executeCouncilTurn(newPrompt, priorTurns, runAdvisors, runAttachedFiles);
          const updatedTurns  = [...priorTurns, completedTurn];
          setTurns(updatedTurns);

          if (priorTurns.length === 0) {
            const dbId = await createNewSession(completedTurn).catch(() => null);
            setActiveDbSessionId(dbId);
            setActiveSessionId(dbId);
          } else if (activeDbSessionId) {
            await appendTurnToSession(activeDbSessionId, completedTurn).catch(() => {});
          }

          await refreshSessionList();
          setPhase("conversation");
        } catch (e) {
          setError(e.message || "Something went wrong.");
          setPhase(priorTurns.length === 0 ? "idle" : "conversation");
        }
      }, [isProcessing, turns, activeDbSessionId, safeAdvisors, attachedFiles, executeCouncilTurn, refreshSessionList]);

      const handleInitialSubmit = useCallback(() => {
        if (!initialQuestion.trim() || isProcessing) return;
        runTurn(initialQuestion);
      }, [initialQuestion, isProcessing, runTurn]);

      const handleFollowUpSubmit = useCallback(() => {
        const text = followUpInput.trim();
        if (!text || isProcessing) return;
        setFollowUpInput(""); // clear immediately so the UX feels responsive
        runTurn(text);
      }, [followUpInput, isProcessing, runTurn]);

      const exportMarkdown = useCallback(() => {
        const activeSession  = sessions.find(s => s.id === activeSessionId);
        const sessionTitle   = activeSession?.title || turns[0]?.prompt?.slice(0, 35) || "Session";
        const sessionDate    = activeSession ? new Date(activeSession.timestamp).toLocaleString() : new Date().toLocaleString();
        const modeName       = MODES[activeMode]?.label || "Decision";
        const allAdvisors    = Object.values(MODES).flatMap(m => m.advisors);
        const advisorName    = id => allAdvisors.find(a => a.id === id)?.name || id;

        const lines = [
          `# Council Session: ${sessionTitle}`,
          `*${sessionDate}*`,
          `*Mode: ${modeName}*`,
          "",
        ];

        turns.forEach((t, i) => {
          lines.push(`---\n\n## Turn ${i + 1}: ${t.prompt}\n`);
          Object.entries(t.advisorTexts).forEach(([id, txt]) => {
            lines.push(`### ${advisorName(id)}\n${txt}\n`);
          });
          if (t.peerReview) lines.push(`### Peer Review\n${t.peerReview}\n`);
          if (t.verdict)    lines.push(`### Chairman's Verdict\n${t.verdict}\n`);
        });

        const slug = sessionTitle.replace(/[^a-z0-9]/gi, "-").toLowerCase().slice(0, 50);
        const blob = new Blob([lines.join("\n")], { type: "text/markdown" });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href = url; a.download = `council-${slug}.md`; a.click();
        URL.revokeObjectURL(url);
      }, [turns, sessions, activeSessionId, activeMode]);

      return (
        <div className="app-shell">

          {isMobile && sidebarOpen && (
            <div
              onClick={() => setSidebarOpen(false)}
              style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 199 }}
            />
          )}
          <HistorySidebar
            sessions={sessions} activeSessionId={activeSessionId}
            isOpen={sidebarOpen} isMobile={isMobile}
            onSelect={handleSelectSession}
            onNewCouncil={handleNewCouncil}
            onToggle={() => setSidebarOpen(v => !v)}
          />

          <div className="main-panel">
            <AppHeader isRunning={isProcessing} />
            <div style={{ maxWidth: 700, margin: "0 auto", padding: "0 0 80px" }}>

              {showSettings && (
                <SettingsPanel
                  apiKey={apiKey} model={model} onModel={setModel}
                  fastAdvisors={fastAdvisors} onFast={setFastAdvisors}
                  advisorCount={safeAdvisors.length}
                  onAdvisorCount={n => { setAdvisorCount(n); setSelectedAdvisors(ADVISORS.slice(0, n).map(a => a.id)); }}
                  peerReviewEnabled={peerReviewEnabled} onPeerReview={setPeerReviewEnabled}
                  generateDiagrams={generateDiagrams} onGenerateDiagrams={setGenerateDiagrams}
                  onBudgetMode={() => { setModel(FAST_MODEL); setFastAdvisors(true); setAdvisorCount(3); setSelectedAdvisors(ADVISORS.slice(0, 3).map(a => a.id)); setPeerReviewEnabled(false); setGenerateDiagrams(false); }}
                  onClearKey={() => { onClearKey(); setShowSettings(false); }}
                  onClose={() => setShowSettings(false)}
                  userContext={userContext} onUserContext={setUserContext} />
              )}

              {/* ── Page header ──────────────────────────────────────── */}
              <div className="council-header" style={{ padding: "32px 32px 0", display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 32 }}>
                <div style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
                  {!sidebarOpen && (
                    <button onClick={() => setSidebarOpen(true)} title="Show history"
                      style={{ marginTop: 6, display: "flex", alignItems: "center", justifyContent: "center", width: 28, height: 28, background: "none", border: "1px solid var(--bd)", borderRadius: 5, color: "var(--t3)", cursor: "pointer", flexShrink: 0, transition: "all 0.2s" }}>
                      <i className="ti ti-layout-sidebar-left-expand" style={{ fontSize: 14 }} />
                    </button>
                  )}
                  <div>
                    <p className="tag" style={{ color: "var(--amber)", marginBottom: 10 }}>Sai's Council</p>
                    <h1 style={{ fontFamily: "var(--display)", fontSize: 58, letterSpacing: 3, color: "var(--t1)", lineHeight: 1, marginBottom: 8 }}>THE COUNCIL</h1>
                    <p style={{ fontSize: 13, color: "var(--t2)", lineHeight: 1.6, maxWidth: "50ch" }}>
                      Five independent advisors. Anonymous peer review. One verdict.<br />
                      Multi-turn conversations — each follow-up builds on the prior thread.
                    </p>
                    <p style={{ fontSize: 11, color: "var(--t3)", marginTop: 8 }}>
                      Derived from{" "}
                      <a href="https://karpathy.ai" target="_blank" rel="noopener noreferrer" style={{ color: "var(--t3)", textDecoration: "underline", textUnderlineOffset: 3 }}>Andrej Karpathy</a>'s LLM Council concept
                    </p>
                  </div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 4, flexShrink: 0 }}>
                  {turns.length > 0 && (
                    <button onClick={exportMarkdown} title="Export session as Markdown"
                      style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", fontSize: 12, fontWeight: 500, background: "var(--bg2)", border: "1px solid var(--bd)", borderRadius: 6, color: "var(--t3)", cursor: "pointer" }}>
                      <i className="ti ti-download" style={{ fontSize: 13 }} />
                      Export
                    </button>
                  )}
                  <button onClick={() => setShowSettings(true)}
                    style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", fontSize: 12, fontWeight: 500, background: "var(--bg2)", border: "1px solid var(--bd)", borderRadius: 6, color: "var(--t2)", cursor: "pointer" }}>
                    <i className="ti ti-settings" style={{ fontSize: 14 }} />
                    {fastAdvisors ? `Haiku → ${modelLabel(model)}` : modelLabel(model)} · {safeAdvisors.length}adv
                  </button>
                </div>
              </div>

              <div className="council-content" style={{ padding: "0 32px" }}>

                {/* ── Initial prompt input (first turn only) ─────────── */}
                {phase === "idle" && turns.length === 0 && (
                  <div className="fade-up">
                    <ModeSelector activeMode={activeMode} onSelect={setActiveMode} />
                    <TemplateRow mode={activeMode} onSelect={t => setInitialQuestion(t)} />

                    {/* Hero example prompts — decision mode only */}
                    {activeMode === "decision" && !initialQuestion && (
                      <div style={{ marginBottom: 16, textAlign: "center" }}>
                        <p className="tag" style={{ color: "var(--t3)", marginBottom: 8 }}>Or try an example</p>
                        <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                          {EXAMPLE_PROMPTS.map((p, i) => (
                            <button key={i} onClick={() => setInitialQuestion(p)} className="example-prompt">
                              <i className="ti ti-arrow-right" style={{ fontSize: 11, color: "var(--amber)", marginRight: 7 }} />{p}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* ── Context panel ─────────────────────────────── */}
                    <div style={{ marginBottom: 16 }}>
                      <button onClick={() => setShowContextPanel(p => !p)}
                        className={`btn-context${contextInput ? " has-context" : ""}`}
                        style={{ background: showContextPanel ? "var(--bg3)" : undefined }}>
                        <i className="ti ti-paperclip" style={{ fontSize: 13 }} />
                        {contextInput ? "Context added" : "Add background context"}
                        {contextInput && <span style={{ fontSize: 10, fontFamily: "var(--mono)", marginLeft: 4, opacity: 0.7 }}>(~{Math.round(contextInput.length / 4)} tokens)</span>}
                        <i className={`ti ti-chevron-${showContextPanel ? "up" : "down"}`} style={{ fontSize: 12, marginLeft: "auto" }} />
                      </button>
                      {showContextPanel && (
                        <textarea value={contextInput} onChange={e => setContextInput(e.target.value)}
                          placeholder="Paste background material — a document, article, code snippet, or personal context. Sent to all advisors but kept separate from your question."
                          style={{ width: "100%", marginTop: 6, padding: "12px 14px", background: "var(--bg3)", border: "1px solid var(--bd2)", borderRadius: 6, color: "var(--t1)", fontSize: 13, lineHeight: 1.7, resize: "vertical", minHeight: 120, fontFamily: "var(--sans)", outline: "none" }} />
                      )}
                    </div>

                    <textarea
                      value={initialQuestion}
                      onChange={e => setInitialQuestion(e.target.value)}
                      onKeyDown={e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) handleInitialSubmit(); }}
                      placeholder={currentMode.inputPlaceholder}
                      className="council-input"
                      style={{ borderRadius: showOptions ? "10px 10px 0 0" : 10 }}
                    />

                    {/* File attachments */}
                    <FileAttachmentPanel files={attachedFiles} onAdd={addFiles} onRemove={removeFile} />
                    <FileTokenWarning files={attachedFiles} />

                    {/* Collapsible options row */}
                    {showOptions && (
                      <div className="options-panel fade-up">
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
                          <DiagramToggle enabled={generateDiagrams} onToggle={() => setGenerateDiagrams(v => !v)} />
                          <button onClick={() => setFastAdvisors(v => !v)}
                            className={`diagram-toggle ${fastAdvisors ? "is-on" : "is-off"}`}
                            style={{ borderColor: fastAdvisors ? "var(--green-ring)" : undefined, color: fastAdvisors ? "var(--green)" : undefined, background: fastAdvisors ? "var(--green-tint)" : undefined }}>
                            <i className="ti ti-bolt" style={{ fontSize: 13 }} />
                            {fastAdvisors ? "Fast advisors on" : "Fast advisors"}
                          </button>
                          <button onClick={() => setPeerReviewEnabled(v => !v)}
                            className={`diagram-toggle ${peerReviewEnabled ? "is-on" : "is-off"}`}
                            style={{ borderColor: peerReviewEnabled ? "var(--purple-ring)" : undefined, color: peerReviewEnabled ? "var(--purple)" : undefined, background: peerReviewEnabled ? "var(--purple-tint)" : undefined }}>
                            <i className="ti ti-analyze" style={{ fontSize: 13 }} />
                            {peerReviewEnabled ? "Peer review on" : "Peer review"}
                          </button>
                        </div>
                        <AdvisorPicker selected={selectedAdvisors} onChange={setSelectedAdvisors} />
                      </div>
                    )}

                    <div style={{ margin: "12px 0 28px" }}>
                      <button onClick={handleInitialSubmit} disabled={!initialQuestion.trim()} className="btn-convene">
                        CONVENE THE COUNCIL
                      </button>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 10 }}>
                        <button onClick={() => setShowOptions(v => !v)}
                          className={`btn-options${showOptions ? " is-open" : ""}`}>
                          <i className="ti ti-sliders-2" style={{ fontSize: 13 }} />
                          Options
                          {safeAdvisors.length < ADVISORS.length && (
                            <span style={{ color: "var(--amber)", marginLeft: 1 }}>· {safeAdvisors.length} advisors</span>
                          )}
                          <i className={`ti ti-chevron-${showOptions ? "up" : "down"}`} style={{ fontSize: 11 }} />
                        </button>
                        <span style={{ flex: 1 }} />
                        <kbd style={{ fontSize: 11, color: "var(--t3)", background: "var(--bg3)", border: "1px solid var(--bd)", borderRadius: 5, padding: "3px 7px", fontFamily: "var(--mono)" }}>⌘ ↵</kbd>
                      </div>
                    </div>

                    {error && (
                      <div style={{ padding: "11px 15px", marginBottom: 20, background: "var(--red-tint)", border: "1px solid var(--red-ring)", borderRadius: 7, fontSize: 13, color: "var(--red)" }}>
                        <i className="ti ti-alert-circle" style={{ marginRight: 7 }} />{error}
                      </div>
                    )}

                    {(() => {
                      const displayAdvisors = activeMode === "decision" ? safeAdvisors : modeAdvisors.slice(0, advisorCount);
                      return (<>
                        <p className="tag" style={{ color: "var(--t3)", marginBottom: 10 }}>
                          The {["","","two","three","four","five"][displayAdvisors.length] || displayAdvisors.length} advisors
                        </p>
                        <div className="advisor-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                          {displayAdvisors.map((a, i) => (
                        <div key={a.id} style={{ gridColumn: (displayAdvisors.length % 2 !== 0 && i === displayAdvisors.length - 1) ? "span 2" : undefined, padding: "12px 14px", background: a.tint, border: `1px solid ${a.ring}`, borderRadius: 7 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
                            <i className={`ti ${a.icon}`} style={{ fontSize: 13, color: a.accent }} />
                            <span style={{ fontSize: 13, fontWeight: 500, color: "var(--t1)" }}>{a.name}</span>
                          </div>
                          <p className="tag" style={{ color: "var(--t3)", fontSize: 9 }}>{a.tagline}</p>
                        </div>
                      ))}
                        </div>
                      </>);
                    })()}
                  </div>
                )}

                {/* ── Completed conversation turns ──────────────────── */}
                {turns.length > 0 && (
                  <ConversationThread
                    turns={turns}
                    openPanels={openPanels}
                    onTogglePanel={togglePanel}
                  />
                )}

                {/* ── Active turn loading state ─────────────────────── */}
                {isProcessing && (
                  <div className="fade-up" style={{ marginTop: turns.length > 0 ? 28 : 0 }}>
                    {turns.length > 0 && (
                      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20, paddingTop: 4, borderTop: "1px solid var(--bd)" }}>
                        <div className="spin" style={{ width: 10, height: 10, border: "1.5px solid var(--bd)", borderTopColor: "var(--amber)", borderRadius: "50%", flexShrink: 0 }} />
                        <span className="tag" style={{ color: "var(--amber)", fontSize: 9 }}>Follow-up · Turn {turns.length + 1}</span>
                      </div>
                    )}

                    <PhaseStepper phase={phase} showReview={peerReviewEnabled}
                      advisorsDone={Object.keys(advisorDone).length} advisorsTotal={safeAdvisors.length} />

                    {phase === "advisors" && (
                      <div>
                        <p className="tag" style={{ color: "var(--t3)", marginBottom: 10 }}>Advisors deliberating</p>
                        {(activeMode === "decision" ? safeAdvisors : modeAdvisors.slice(0, advisorCount)).map(a => (
                          <AdvisorRow key={a.id} advisor={a} live={live[a.id]} done={!!advisorDone[a.id]} phase="advisors"
                            isSpotlit={!spotlitAdvisor || spotlitAdvisor === a.id || !!advisorDone[a.id]} />
                        ))}
                      </div>
                    )}

                    {phase === "review" && (
                      <div>
                        <p className="tag" style={{ color: "var(--t3)", marginBottom: 10 }}>Consolidated peer review</p>
                        <div style={{ padding: "13px 16px", background: "var(--bg2)", border: "1px solid var(--bd)", borderRadius: 7 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: liveRev ? 8 : 0 }}>
                            <i className="ti ti-analyze pulse" style={{ fontSize: 13, color: "var(--purple)" }} />
                            <span style={{ fontSize: 13, fontWeight: 500, color: "var(--t1)" }}>Council Analyst</span>
                            <span className="tag" style={{ color: "var(--t3)", fontSize: 9 }}>cross-examining all five</span>
                          </div>
                          {liveRev && (
                            <div style={{ fontSize: 12, lineHeight: 1.7, color: "var(--t2)", maxHeight: 80, overflow: "hidden", maskImage: "linear-gradient(to bottom, black 40%, transparent 100%)", WebkitMaskImage: "linear-gradient(to bottom, black 40%, transparent 100%)" }}>
                              {liveRev}<span style={{ animation: "blink .7s step-end infinite", color: "var(--purple)" }}>▋</span>
                            </div>
                          )}
                        </div>
                      </div>
                    )}

                    {phase === "synthesis" && (
                      <div>
                        <p className="tag" style={{ color: "var(--amber)", marginBottom: 10 }}>Chairman synthesizing verdict</p>
                        <div style={{ padding: 20, minHeight: 100, background: "var(--amber-tint)", border: "1px solid var(--amber-ring)", borderRadius: 8 }}>
                          {liveVerdict
                            ? <><Md text={liveVerdict} /><span style={{ animation: "blink .7s step-end infinite", color: "var(--amber)" }}>▋</span></>
                            : <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                <div className="spin" style={{ width: 13, height: 13, border: "1.5px solid var(--bd)", borderTopColor: "var(--amber)", borderRadius: "50%", flexShrink: 0 }} />
                                <span className="tag" style={{ color: "var(--amber)", fontSize: 9 }}>Deliberating…</span>
                              </div>}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* ── Follow-up input and export (conversation phase) ── */}
                {phase === "conversation" && turns.length > 0 && (
                  <div className="follow-up-section fade-up">

                    {/* Primary CTAs */}
                    {!showFollowUpInput && (
                      <div style={{ display: "flex", gap: 10, marginBottom: 24 }}>
                        <button onClick={() => { setShowFollowUpInput(true); setTimeout(() => document.getElementById("follow-up-textarea")?.focus(), 50); }}
                          className="btn-cta-primary">
                          <i className="ti ti-message-plus" style={{ fontSize: 16 }} />
                          ASK A FOLLOW-UP
                        </button>
                        <button onClick={handleNewCouncil} className="btn-cta-secondary">
                          <i className="ti ti-plus" style={{ fontSize: 16 }} />
                          NEW COUNCIL
                        </button>
                      </div>
                    )}

                    {/* Follow-up input (revealed on demand) */}
                    {showFollowUpInput && (
                      <div className="fade-up">
                        <p className="tag" style={{ color: "var(--t3)", marginBottom: 10 }}>Continue the conversation</p>
                        <textarea
                          id="follow-up-textarea"
                          value={followUpInput}
                          onChange={e => setFollowUpInput(e.target.value)}
                          onKeyDown={e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) handleFollowUpSubmit(); }}
                          placeholder="Ask a follow-up, push deeper on any point, or request a different angle…"
                          className="council-input"
                          style={{ minHeight: 90, marginBottom: 10 }}
                        />

                        <FileAttachmentPanel files={attachedFiles} onAdd={addFiles} onRemove={removeFile} />
                        <FileTokenWarning files={attachedFiles} />

                        {error && (
                          <div style={{ padding: "10px 14px", margin: "8px 0", background: "var(--red-tint)", border: "1px solid var(--red-ring)", borderRadius: 7, fontSize: 13, color: "var(--red)" }}>
                            <i className="ti ti-alert-circle" style={{ marginRight: 7 }} />{error}
                          </div>
                        )}

                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 10 }}>
                          <button onClick={handleFollowUpSubmit} disabled={!followUpInput.trim()}
                            className="btn-convene" style={{ fontSize: 17, letterSpacing: 2, padding: "13px 20px" }}>
                            FOLLOW UP
                          </button>
                          <DiagramToggle enabled={generateDiagrams} onToggle={() => setGenerateDiagrams(v => !v)} />
                          <kbd style={{ fontSize: 11, color: "var(--t3)", background: "var(--bg3)", border: "1px solid var(--bd)", borderRadius: 5, padding: "3px 7px", flexShrink: 0, fontFamily: "var(--mono)" }}>⌘ ↵</kbd>
                        </div>
                      </div>
                    )}

                    <div style={{ display: "flex", gap: 8, marginTop: showFollowUpInput ? 16 : 0 }}>
                      <button onClick={exportMarkdown}
                        style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "var(--t2)", background: "var(--bg3)", border: "1px solid var(--bd)", padding: "8px 14px", borderRadius: 6, cursor: "pointer" }}>
                        <i className="ti ti-download" style={{ fontSize: 12 }} />Export markdown
                      </button>
                      {showFollowUpInput && (
                        <button onClick={handleNewCouncil}
                          style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "var(--t3)", background: "transparent", border: "1px solid var(--bd)", padding: "8px 14px", borderRadius: 6, cursor: "pointer" }}>
                          <i className="ti ti-plus" style={{ fontSize: 12 }} />New council
                        </button>
                      )}
                    </div>
                  </div>
                )}

              </div>
            </div>
          </div>

        </div>
      );
    }

    /* ── APP ROOT ───────────────────────────────────────────────────── */

    function App() {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem("council-key") || "");
      const clearKey = () => { localStorage.removeItem("council-key"); setApiKey(""); };
      if (!apiKey) return <ApiKeySetup onSave={setApiKey} />;
      return <Council apiKey={apiKey} onClearKey={clearKey} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
