<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sai's Council</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <!-- Dexie: IndexedDB for persistent multi-turn session history -->
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.min.js"></script>
  <!-- Mermaid: diagram rendering for the optional diagram generation feature -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
  <script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.4.0/dist/tabler-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rubik:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           oklch(8% 0.012 55);
      --bg2:          oklch(12% 0.010 55);
      --bg3:          oklch(17% 0.008 55);
      --bg4:          oklch(22% 0.008 55);
      --bd:           oklch(30% 0.008 55 / 0.7);
      --bd2:          oklch(40% 0.008 55 / 0.9);
      --t1:           oklch(90% 0.006 55);
      --t2:           oklch(60% 0.005 55);
      --t3:           oklch(38% 0.005 55);
      --amber:        oklch(72% 0.16 65);
      --amber-tint:   oklch(72% 0.16 65 / 0.10);
      --amber-ring:   oklch(72% 0.16 65 / 0.28);
      --green:        oklch(65% 0.14 160);
      --green-tint:   oklch(65% 0.14 160 / 0.08);
      --green-ring:   oklch(65% 0.14 160 / 0.25);
      --red:          oklch(62% 0.20 25);
      --red-tint:     oklch(62% 0.20 25 / 0.08);
      --red-ring:     oklch(62% 0.20 25 / 0.25);
      --purple:       oklch(65% 0.17 290);
      --purple-tint:  oklch(65% 0.17 290 / 0.08);
      --purple-ring:  oklch(65% 0.17 290 / 0.25);
      --blue:         oklch(65% 0.14 232);
      --blue-tint:    oklch(65% 0.14 232 / 0.08);
      --blue-ring:    oklch(65% 0.14 232 / 0.25);
      --display:      'Bebas Neue', Impact, sans-serif;
      --sans:         'Rubik', system-ui, sans-serif;
      --mono:         'Fira Code', 'Courier New', monospace;
      --sidebar-w:    260px;
    }

    html { scroll-behavior: smooth; }
    body { font-family: var(--sans); background: var(--bg); color: var(--t1); min-height: 100dvh; -webkit-font-smoothing: antialiased; }
    textarea, input, button { font-family: inherit; }
    button { cursor: pointer; }

    ::-webkit-scrollbar       { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bd2); border-radius: 2px; transition: background 0.2s; }
    ::-webkit-scrollbar-thumb:hover { background: var(--t3); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes pulse  { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    @keyframes blink  { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .fade-up { animation: fadeUp .28s ease both; }
    .spin     { animation: spin .85s linear infinite; }
    .pulse    { animation: pulse 1.6s ease infinite; }

    .md { font-size: 14px; line-height: 1.75; color: var(--t1); }
    .md p { margin-bottom: .6em; }
    .md p:last-child { margin-bottom: 0; }
    .md ul, .md ol { padding-left: 1.3em; margin-bottom: .6em; }
    .md li { margin-bottom: .2em; }
    .md strong { font-weight: 600; }
    .md em { font-style: italic; }
    .md code { font-family: var(--mono); font-size: 12px; background: var(--bg4); padding: 1px 5px; border-radius: 3px; }
    .md pre { background: var(--bg3); padding: 12px; border-radius: 6px; overflow-x: auto; margin-bottom: .6em; }
    .md pre code { background: none; padding: 0; }
    .md h1, .md h2, .md h3 { font-family: var(--display); letter-spacing: 1px; margin: .8em 0 .4em; }
    .md h1:first-child, .md h2:first-child, .md h3:first-child { margin-top: 0; }
    .md blockquote { padding-left: 12px; border-left: 1px solid var(--bd2); color: var(--t2); margin-bottom: .6em; font-style: italic; }
    .md a { color: var(--amber); text-decoration: none; }

    .tag     { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

    /* ── App shell ─────────────────────────────────────────────────── */
    .app-shell  { display: flex; min-height: 100dvh; }
    .main-panel { flex: 1; min-width: 0; overflow-y: auto; height: 100dvh; }

    /* ── History sidebar ────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0; background: var(--bg2);
      border-right: 1px solid var(--bd); display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100dvh; overflow: hidden;
      transition: width 0.22s ease-in-out, opacity 0.22s ease-in-out, border-color 0.22s;
    }
    .sidebar.is-collapsed { width: 0; opacity: 0; border-color: transparent; pointer-events: none; }
    .sidebar__head { padding: 18px 14px 14px; border-bottom: 1px solid var(--bd); flex-shrink: 0; }
    .sidebar__scroll { flex: 1; overflow-y: auto; padding: 8px 8px 24px; }

    .session-card {
      padding: 9px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 2px;
      border: 1px solid transparent;
      transition: background 0.2s ease-in-out, border-color 0.2s ease-in-out;
    }
    .session-card:hover  { background: var(--bg3); border-color: var(--bd); }
    .session-card.is-active { background: var(--amber-tint); border-color: var(--amber-ring); }
    .session-card__title {
      font-size: 12px; font-weight: 500; color: var(--t1); line-height: 1.4; margin-bottom: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .session-card__time { font-family: var(--mono); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--t3); }

    .new-council-btn {
      width: 100%; padding: 9px 12px; display: flex; align-items: center; gap: 8px;
      background: var(--amber-tint); border: 1px solid var(--amber-ring); border-radius: 6px;
      color: var(--amber); font-size: 12px; font-weight: 500; cursor: pointer;
      transition: background 0.2s ease-in-out;
    }
    .new-council-btn:hover { background: oklch(72% 0.16 65 / 0.18); }

    .sidebar-toggle {
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; background: none; border: none; border-radius: 5px;
      color: var(--t3); cursor: pointer; flex-shrink: 0;
      transition: color 0.2s, background 0.2s;
    }
    .sidebar-toggle:hover { color: var(--t1); background: var(--bg3); }

    /* ── Conversation thread ────────────────────────────────────────── */
    .conversation-thread { display: flex; flex-direction: column; gap: 0; }

    /* Visual separator between turns in a multi-turn thread */
    .turn-separator {
      display: flex; align-items: center; gap: 12; margin: 32px 0 24px;
    }

    /* "One Thing to Do First" — amber callout, elevated, impossible to miss */
    .first-action-item {
      border-left: 4px solid var(--amber);
      padding: 18px 22px 18px 24px;
      background: var(--amber-tint);
      border-radius: 0 8px 8px 0;
      font-size: 15px;
      line-height: 1.8;
      color: var(--t1);
      box-shadow: 0 2px 16px oklch(0% 0 0 / 0.18);
    }

    /* Verdict tabs */
    .verdict-tab-bar { display: flex; gap: 2px; border-bottom: 1px solid var(--bd); margin-bottom: 14px; overflow-x: auto; }
    .verdict-tab-bar::-webkit-scrollbar { height: 0; }
    .verdict-tab { display: flex; align-items: center; gap: 5px; padding: 7px 13px; font-size: 11px; font-weight: 500; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; transition: color .15s; margin-bottom: -1px; }

    /* App header bar */
    .app-header { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: var(--bg2); border-bottom: 1px solid var(--bd); position: sticky; top: 0; z-index: 50; flex-shrink: 0; }

    /* Options row */
    .options-panel { padding: 12px 14px; background: var(--bg3); border: 1px solid var(--bd); border-radius: 0 0 8px 8px; margin-top: -1px; }

    /* Follow-up input section anchored at the bottom of the thread */
    .follow-up-section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--bd);
    }

    /* Diagram toggle button — adjacent to the prompt submit row */
    .diagram-toggle {
      display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 6px;
      font-size: 12px; cursor: pointer; flex-shrink: 0;
      transition: all 0.2s ease-in-out;
    }
    .diagram-toggle.is-on  { background: var(--blue-tint); border: 1px solid var(--blue-ring); color: var(--blue); }
    .diagram-toggle.is-off { background: var(--bg3); border: 1px solid var(--bd); color: var(--t3); }
    .diagram-toggle:hover  { opacity: 0.85; }

    /* Diagram card — rendered when a Mermaid block is found in the verdict */
    .diagram-card {
      padding: 20px; margin-bottom: 16px;
      background: var(--blue-tint); border: 1px solid var(--blue-ring); border-radius: 8px;
      overflow-x: auto;
    }
    .diagram-card svg { max-width: 100%; height: auto; display: block; }

    /* ── Immaculate polish layer ─────────────────────────────────────── */

    /* Primary submit button */
    .btn-convene {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 16px 28px;
      font-family: var(--display); font-size: 21px; letter-spacing: 3px;
      background: var(--amber); color: var(--bg);
      border: none; border-radius: 10px; cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, opacity .15s;
    }
    .btn-convene:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px oklch(72% 0.16 65 / 0.45);
    }
    .btn-convene:not(:disabled):active { transform: translateY(0); box-shadow: none; }
    .btn-convene:disabled { opacity: 0.22; cursor: not-allowed; }

    /* Options toggle */
    .btn-options {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 16px; border-radius: 8px;
      border: 1.5px solid var(--bd); background: var(--bg3);
      color: var(--t2); font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all .15s ease; font-family: var(--sans);
    }
    .btn-options:hover, .btn-options.is-open {
      background: var(--bg4); color: var(--t1); border-color: var(--bd2);
    }

    /* Textarea */
    .council-input {
      width: 100%; min-height: 120px;
      padding: 18px 20px; font-size: 15px; line-height: 1.75;
      background: var(--bg2); border: 1.5px solid var(--bd);
      border-radius: 10px; color: var(--t1);
      outline: none; resize: vertical;
      font-family: var(--sans);
      transition: border-color .2s, box-shadow .2s;
    }
    .council-input:focus {
      border-color: oklch(72% 0.16 65 / 0.55);
      box-shadow: 0 0 0 4px oklch(72% 0.16 65 / 0.07);
    }

    /* Mode selector cards */
    .mode-card {
      flex-shrink: 0; min-width: 140px; padding: 14px 16px;
      background: var(--bg2); border: 1.5px solid var(--bd);
      border-radius: 10px; cursor: pointer; text-align: left;
      transition: transform .2s ease, border-color .2s, box-shadow .2s;
    }
    .mode-card:hover { transform: translateY(-2px); border-color: var(--bd2); box-shadow: 0 4px 18px oklch(0% 0 0 / 0.25); }
    .mode-card.is-active { border-color: var(--amber-ring); background: var(--amber-tint); }
    .mode-card.is-active:hover { box-shadow: 0 4px 18px oklch(72% 0.16 65 / 0.2); }

    /* Attach file buttons */
    .attach-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 8px;
      background: var(--bg3); border: 1.5px solid var(--bd);
      color: var(--t3); font-size: 12px; cursor: pointer;
      font-family: var(--sans); transition: all .15s ease;
    }
    .attach-btn:hover { color: var(--t1); background: var(--bg4); border-color: var(--bd2); }
    .attach-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Post-completion CTA buttons */
    .btn-cta-primary {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 15px 20px; font-family: var(--display); font-size: 18px; letter-spacing: 2px;
      background: var(--amber); color: var(--bg);
      border: none; border-radius: 10px; cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .btn-cta-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px oklch(72% 0.16 65 / 0.4); }

    .btn-cta-secondary {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 15px 20px; font-family: var(--display); font-size: 18px; letter-spacing: 2px;
      background: transparent; color: var(--t2);
      border: 1.5px solid var(--bd); border-radius: 10px; cursor: pointer;
      transition: all .15s ease;
    }
    .btn-cta-secondary:hover { background: var(--bg3); color: var(--t1); border-color: var(--bd2); }

    /* Context panel toggle */
    .btn-context {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 9px 14px; border-radius: 8px; font-size: 12px;
      border: 1.5px solid var(--bd); background: none;
      color: var(--t3); cursor: pointer; transition: all .15s ease;
      font-family: var(--sans);
    }
    .btn-context:hover { background: var(--bg3); color: var(--t2); border-color: var(--bd2); }
    .btn-context.has-context { border-color: var(--amber-ring); color: var(--amber); }

    /* Example prompt chips */
    .example-prompt {
      width: 100%; padding: 11px 16px; font-size: 13px; line-height: 1.5;
      background: var(--bg2); border: 1.5px solid var(--bd);
      border-radius: 8px; color: var(--t2); cursor: pointer; text-align: left;
      transition: all .15s ease; font-family: var(--sans);
    }
    .example-prompt:hover { border-color: var(--amber-ring); color: var(--t1); background: var(--amber-tint); }

    /* Advisor picker pills */
    .advisor-pill {
      display: flex; align-items: center; gap: 7px;
      padding: 7px 13px; border-radius: 20px;
      cursor: pointer; transition: all .15s ease;
      font-family: var(--sans);
    }
    .advisor-pill:hover:not(:disabled) { opacity: 0.9; transform: scale(1.03); }
    .advisor-pill:disabled { cursor: not-allowed; }

    /* Session cards hover */
    .session-card:hover  { background: var(--bg3); border-color: var(--bd); }
    .session-card.is-active { background: var(--amber-tint); border-color: var(--amber-ring); }

    /* ── Responsive breakpoints ────────────────────────────────────── */
    @media (max-width: 768px) {
      :root { --sidebar-w: 100%; }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100dvh;
        z-index: 200;
        width: 280px;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }

      .sidebar.is-open-mobile {
        transform: translateX(0);
        box-shadow: 8px 0 32px rgba(0,0,0,0.5);
      }

      .sidebar.is-collapsed {
        width: 280px;
        opacity: 1;
        border-color: var(--bd);
        pointer-events: auto;
        transform: translateX(-100%);
      }

      .main-panel { height: auto; overflow-y: visible; }

      .advisor-grid { grid-template-columns: 1fr !important; }

      .council-content { padding: 0 16px !important; }
      .council-header  { padding: 20px 16px 0 !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useCallback, useEffect, useRef, useMemo } = React;

    /* ── MERMAID INIT ─────────────────────────────────────────────────
       Disable auto-start; we call mermaid.render() manually per component
       so diagrams don't conflict with React's DOM management.            */
    if (typeof mermaid !== "undefined") {
      mermaid.initialize({ startOnLoad: false, theme: "dark", securityLevel: "loose" });
    }

    /* ── LOCAL DATABASE ───────────────────────────────────────────────
       Version 1 (legacy): sessions stored with flat prompt/verdict fields.
       Version 2 (current): each session has a `turns` array so the full
       conversational thread is stored and replayable without an API call.  */
    const db = new Dexie("SaiCouncilDB");
    db.version(1).stores({ sessions: "++id, timestamp, title" });
    db.version(2).stores({ sessions: "++id, timestamp, title" }).upgrade(tx =>
      tx.table("sessions").toCollection().modify(session => {
        // Wrap any legacy flat-field sessions into the new turns format
        if (!session.turns) {
          session.turns = [{
            prompt:       session.prompt       || "",
            advisorTexts: session.advisorTexts || {},
            peerReview:   session.peerReview   || "",
            verdict:      session.verdict      || "",
            diagramCode:  null,
          }];
          delete session.prompt;
          delete session.advisorTexts;
          delete session.peerReview;
          delete session.verdict;
        }
      })
    );

    async function createNewSession(firstTurn) {
      const title = firstTurn.prompt.trim().slice(0, 35) + (firstTurn.prompt.trim().length > 35 ? "…" : "");
      return db.sessions.add({ title, timestamp: Date.now(), turns: [firstTurn] });
    }

    async function appendTurnToSession(sessionId, newTurn) {
      const session = await db.sessions.get(sessionId);
      if (!session) return;
      return db.sessions.update(sessionId, { turns: [...(session.turns || []), newTurn] });
    }

    /* ── CONSTANTS ─────────────────────────────────────────────────── */

    const MODELS = [
      { id: "claude-opus-4-7",           label: "Opus 4.7",   sub: "Highest quality" },
      { id: "claude-sonnet-4-6",         label: "Sonnet 4.6", sub: "Balanced · default" },
      { id: "claude-haiku-4-5-20251001", label: "Haiku 4.5",  sub: "Fastest · cheapest" },
    ];

    // Phases 1+2 (advisors + peer review) are routed to this cheap model.
    // Only the Chairman synthesis uses the user's selected quality model.
    const FAST_MODEL = "claude-haiku-4-5-20251001";

    // Token ceilings per phase.
    // advisor: "100 words max" ≈ 130 tokens; ceiling at 120 physically prevents
    //   overruns — LLMs fill available space, so a loose ceiling causes cost bloat.
    // review:  ~100 words target; 150 gives a small buffer.
    // chairman: raised to allow full plans and step-by-step instructions.
    //   Haiku  1800 ≈ 1350 words — enough for a detailed multi-step plan.
    //   Premium 1400 ≈ 1050 words — Sonnet/Opus write more densely.
    const TOKEN_BUDGETS = { advisor: 120, review: 160, chairmanHaiku: 900, chairmanPremium: 700 };

    // Chars of each advisor response forwarded to the peer reviewer and chairman.
    // Haiku is cheap — pass full text. Sonnet/Opus are expensive — 180-char
    // snippets (~25 tokens each) cut input cost ~65% with minimal quality loss.
    const ADVISOR_SNIPPET_CHARS = { [FAST_MODEL]: Infinity, default: 180 };

    // Returns an estimated USD cost per first turn.
    // Accounts for all five user-controlled knobs simultaneously so the settings
    // panel live badge reflects every combination accurately.
    function estimateCostPerTurn(chairmanModel, fastAdvisorsOn, advisorCount = 5, peerReviewOn = true, diagramOn = false) {
      const RATES = {
        "claude-haiku-4-5-20251001": { in: 1.00,  out: 5.00  },  // corrected from 0.80/4.00
        "claude-sonnet-4-6":         { in: 3.00,  out: 15.00 },
        "claude-opus-4-7":           { in: 5.00,  out: 25.00 },  // corrected from 15.00/75.00
      };
      const isHaikuChairman  = chairmanModel === FAST_MODEL;
      const advisorRate      = fastAdvisorsOn ? RATES[FAST_MODEL] : (RATES[chairmanModel] || RATES[FAST_MODEL]);
      const chairmanRate     = RATES[chairmanModel] || RATES[FAST_MODEL];
      // Peer reviewer gets compressed input: snippets (~45t each) + instruction (~100t)
      const reviewInputToks  = advisorCount * 45 + 100;
      // Chairman gets compressed input for non-Haiku; full block for Haiku
      const chairmanInToks   = isHaikuChairman ? (advisorCount * 130 + 350) : (advisorCount * 25 + 250);
      // Chairman output estimate raised to reflect deeper plan/instruction
      // output. Diagrams add ~150 tokens on top.
      const chairmanOutToks  = (isHaikuChairman ? 1100 : 900) + (diagramOn ? 150 : 0);
      // Output estimate uses 110 tokens (just under the 120 hard ceiling) since
      // the model fills to the cap — 130 was optimistic when ceiling was loose.
      const phase1 = (advisorCount * 180 * advisorRate.in + advisorCount * 110 * advisorRate.out) / 1e6;
      const phase2 = peerReviewOn ? (reviewInputToks * advisorRate.in + 130 * advisorRate.out) / 1e6 : 0;
      const phase3 = (chairmanInToks * chairmanRate.in + chairmanOutToks * chairmanRate.out) / 1e6;
      return phase1 + phase2 + phase3;
    }

    // Each advisor's unique instructions live in `lens`, not `system`.
    // All five share SHARED_ADVISOR_SYSTEM so calls 2–5 in each turn get
    // a cache hit on the system block (10% of normal input cost per call).
    const ADVISORS = [
      {
        id: "contrarian",      name: "The Contrarian",    accent: "var(--red)",
        tint: "var(--red-tint)",    ring: "var(--red-ring)",    icon: "ti-sword",
        tagline: "Hunts for fatal flaws",
        lens: "Find the single most dangerous assumption and name the specific failure mode it creates. What breaks first, and exactly why? Don't list concerns — commit to the one critical flaw. Be surgical.",
      },
      {
        id: "firstprinciples", name: "First Principles",  accent: "var(--purple)",
        tint: "var(--purple-tint)", ring: "var(--purple-ring)", icon: "ti-atom",
        tagline: "Questions the question itself",
        lens: "Ignore the surface question. What is actually being decided? Identify the one load-bearing assumption it is built on. Is that assumption true? If not, what should the real question be?",
      },
      {

    function buildUserMessageWithFiles(prompt, attachedFiles) {
      if (!attachedFiles || !attachedFiles.length) return prompt;

      const textFiles  = attachedFiles.filter(f => f.type === "text");
      const pdfFiles   = attachedFiles.filter(f => f.type === "pdf");
      const imageFiles = attachedFiles.filter(f => f.type === "image");
      const errorFiles = attachedFiles.filter(f => f.type === "error");

        content.push({
          type: "text",
          text: textFiles.map(f =>

          cache_control: { type: "ephemeral" },

          text: errorFiles.map(f => `NOTE: Could not read ${f.name} — ${f.errorMessage}`).join("\n"),

    /* ── STREAMING ──────────────────────────────────────────────────────
       cachedText, when provided, becomes a leading ephemeral content block.
       Anthropic reuses this across calls in the same session window —
       critical for multi-turn threads where prior context grows each turn.  */
    function buildMessages(user, cachedText) {
      const cacheBlock = cachedText
        ? { type: "text", text: cachedText, cache_control: { type: "ephemeral" } }
        : null;

      if (!cacheBlock) return [{ role: "user", content: user }];

      // user is a string or an array of content blocks
      const userBlocks = typeof user === "string"
        ? [{ type: "text", text: user }]
        : user;

      return [{ role: "user", content: [cacheBlock, ...userBlocks] }];
    }

    async function* streamClaude(system, user, apiKey, model, cachedText, maxTokens = 1500) {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-beta": "prompt-caching-2024-07-31,extended-cache-ttl-2025-04-11",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model, max_tokens: maxTokens, stream: true,
          // System block is cached so it's free on all subsequent advisor calls
          system: [{ type: "text", text: system, cache_control: { type: "ephemeral" } }],
          messages: buildMessages(user, cachedText),
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `HTTP ${res.status}`);
      }
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop() ?? "";
          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const raw = line.slice(6).trim();
            if (raw === "[DONE]") return;
            try {
              const ev = JSON.parse(raw);
              if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta") yield ev.delta.text;
            } catch {}
          }
        }
      } finally { reader.releaseLock(); }
    }

    async function collect(system, user, apiKey, model, onChunk, cachedText, maxTokens = 1500) {
      let text = "";
      for await (const chunk of streamClaude(system, user, apiKey, model, cachedText, maxTokens)) {
        text += chunk;
        onChunk?.(text);
      }
      return text;
    }

    /* ── PARSING UTILITIES ──────────────────────────────────────────── */

    function parseVerdict(text) {
      const defs = [
        { key: "agrees",  re: /##\s*Where the Council Agrees\s*([\s\S]*?)(?=##|$)/i },
        { key: "clashes", re: /##\s*Where the Council Clashes\s*([\s\S]*?)(?=##|$)/i },
        { key: "blind",   re: /##\s*Blind Spots[^\n]*\s*([\s\S]*?)(?=##|$)/i },
        { key: "rec",     re: /##\s*The Recommendation\s*([\s\S]*?)(?=##|$)/i },
        { key: "first",   re: /##\s*The One Thing[^\n]*\s*([\s\S]*?)(?=##|$)/i },
      ];
      const out = {};
      defs.forEach(({ key, re }) => { const m = text.match(re); out[key] = m ? m[1].trim() : ""; });
      if (!out.rec) out.raw = text;
      return out;
    }

    // Strips the first Mermaid block out of the raw chairman response and returns
    // it separately so the verdict prose renders cleanly in Markdown while the
    // diagram is isolated in its own card. The diagram can appear anywhere in the
    // response — beginning, middle, or end — so the regex is global-aware and we
    // collapse any double blank lines left behind after removal.
    function splitVerdictAndDiagram(rawText) {
      const match = rawText.match(/```mermaid\s*([\s\S]*?)```/);
      if (match) {
        const diagramCode  = match[1].trim();
        const verdictText  = rawText
          .replace(/```mermaid[\s\S]*?```/, "")
          .replace(/\n{3,}/g, "\n\n")  // collapse triple+ blank lines
          .trim();
        return { verdictText, diagramCode };
      }
      return { verdictText: rawText, diagramCode: null };
    }

    function buildSessionContext(userContext, completedTurns) {
      const parts = [];
      if (userContext && userContext.trim()) {
        parts.push(`=== User Context ===\n${userContext.trim()}`);
      }
      if (completedTurns.length) {
        const turnText = completedTurns.map((t, i) => {
          const advisorBlock = Object.entries(t.advisorTexts).map(([id, txt]) => `**${id}:** ${txt}`).join("\n\n");
          return [
            `=== Turn ${i + 1} ===`,
            `Question: ${t.prompt}`,
            `\nAdvisor Responses:\n${advisorBlock}`,
            `\nPeer Review:\n${t.peerReview || ""}`,
            `\nChairman Verdict:\n${t.verdict || ""}`,
          ].join("\n");
        }).join("\n\n---\n\n");
        parts.push(turnText);
      }
      return parts.length ? parts.join("\n\n===\n\n") : null;
    }
    // Backward-compat alias used by executeCouncilTurn when no userContext is needed
    const buildPriorTurnsContext = turns => buildSessionContext(null, turns);

    function relativeTime(ts) {
      const m = Math.floor((Date.now() - ts) / 60000);
      if (m < 1)  return "just now";
      if (m < 60) return `${m}m ago`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h ago`;
      const d = Math.floor(h / 24);
      if (d < 7)  return `${d}d ago`;
      return new Date(ts).toLocaleDateString();
    }

    /* ── SMALL COMPONENTS ───────────────────────────────────────────── */

    function Md({ text, style }) {
      const html = useMemo(() => {
        if (!text) return "";
        try { return marked.parse(text, { breaks: true, gfm: true }); }
        catch { return `<p>${String(text).replace(/</g, "&lt;")}</p>`; }
      }, [text]);
      return <div className="md" style={style} dangerouslySetInnerHTML={{ __html: html }} />;
    }

    function useCopy(text) {
      const [copied, setCopied] = useState(false);
      const copy = useCallback(() => {
        navigator.clipboard.writeText(text)
          .then(() => { setCopied(true); setTimeout(() => setCopied(false), 1600); })
          .catch(() => {});
      }, [text]);
      return [copied, copy];
    }

    function CopyBtn({ text, style }) {
      const [copied, copy] = useCopy(text);
      return (
        <button onClick={copy} title={copied ? "Copied!" : "Copy"} style={{ background: "none", border: "none", padding: 4, color: copied ? "var(--green)" : "var(--t3)", cursor: "pointer", lineHeight: 1, transition: "color .15s", ...style }}>
          <i className={`ti ${copied ? "ti-check" : "ti-copy"}`} style={{ fontSize: 13 }} />
        </button>
      );
    }

    function Divider({ label }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 16, margin: "28px 0 18px" }}>
          <span className="tag" style={{ color: "var(--t3)", flexShrink: 0 }}>{label}</span>
          <div style={{ flex: 1, height: 1, background: "var(--bd)" }} />
        </div>
      );
    }

    /* ── MERMAID DIAGRAM ────────────────────────────────────────────────
       Renders a Mermaid code string into an SVG inside a dedicated card.
       Each instance gets a unique ID so multiple diagrams per thread
       don't collide.                                                       */
    function MermaidDiagram({ code }) {
      const containerRef = useRef(null);
      const uniqueId     = useRef(`mermaid-${Math.random().toString(36).slice(2, 9)}`);

      useEffect(() => {
        if (!containerRef.current || !code || typeof mermaid === "undefined") return;
        mermaid.render(uniqueId.current, code)
          .then(({ svg }) => {
            if (containerRef.current) containerRef.current.innerHTML = svg;
          })
          .catch(() => {
            if (containerRef.current) containerRef.current.textContent = "";
          });
      }, [code]);

      return (
        <div style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
            <i className="ti ti-chart-dots-3" style={{ fontSize: 13, color: "var(--blue)" }} />
            <span className="tag" style={{ color: "var(--blue)", fontSize: 10 }}>Supporting diagram</span>
          </div>
          <div className="diagram-card">
            <div ref={containerRef} />
          </div>
        </div>
      );
    }

    /* ── FILE UPLOAD UTILITIES ──────────────────────────────────────── */

    const attachBtnStyle = {
      display: "flex", alignItems: "center", gap: 6,
      padding: "6px 12px", borderRadius: 6,
      background: "var(--bg3)", border: "1px solid var(--bd)",
      color: "var(--t3)", fontSize: 12, cursor: "pointer",
      fontFamily: "var(--sans)", transition: "all .15s",
    };

    function fileIcon(mimeType) {
      if (!mimeType) return "ti-file";
      if (mimeType.startsWith("image/")) return "ti-photo";
      if (mimeType === "application/pdf") return "ti-file-type-pdf";
      if (mimeType.includes("word")) return "ti-file-type-doc";
      if (mimeType === "text/csv") return "ti-table";
      if (mimeType === "application/json") return "ti-braces";
      if (mimeType.startsWith("text/")) return "ti-file-text";
      return "ti-file";
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return `${bytes}B`;
      if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)}KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)}MB`;
    }

    function guessMimeType(filename) {
      const ext = filename.split(".").pop()?.toLowerCase();
      const map = {
        txt: "text/plain", md: "text/markdown", csv: "text/csv",
        json: "application/json", html: "text/html", xml: "application/xml",
        py: "text/x-python", js: "text/javascript", ts: "text/typescript",
        jsx: "text/javascript", tsx: "text/typescript",
        pdf: "application/pdf",
        docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
        doc: "application/msword",
        png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg",
        gif: "image/gif", webp: "image/webp",
      };
      return map[ext] || "application/octet-stream";
    }

    function isCodeFile(filename) {
      const codeExts = ["py","js","ts","jsx","tsx","css","html","json","yaml","yml","sh","bash","rb","go","rs","java","cpp","c","h","sql","graphql","proto"];
      return codeExts.includes(filename.split(".").pop()?.toLowerCase());
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = () => resolve(reader.result);
        reader.onerror = () => reject(new Error(`Failed to read: ${file.name}`));
        reader.readAsDataURL(file);
      });
    }

    async function readFileToAttachment(file) {
      const id       = `file-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
      const mimeType = file.type || guessMimeType(file.name);

      if (mimeType.startsWith("image/")) {
        const base64 = await fileToBase64(file);
        return { id, name: file.name, type: "image", mimeType, size: file.size, source: "local", base64Data: base64.split(",")[1] };
      }

      if (mimeType === "application/pdf") {
        const base64 = await fileToBase64(file);
        return { id, name: file.name, type: "pdf", mimeType, size: file.size, source: "local", base64Data: base64.split(",")[1] };
      }

      if (mimeType.startsWith("text/") || ["application/json","application/xml"].includes(mimeType) || isCodeFile(file.name)) {
        const text = await file.text();
        return { id, name: file.name, type: "text", mimeType, size: file.size, source: "local", textContent: text };
      }

      if (mimeType.includes("word") || file.name.endsWith(".docx")) {
        if (typeof mammoth !== "undefined") {
          const arrayBuffer = await file.arrayBuffer();
          const result      = await mammoth.extractRawText({ arrayBuffer });
          return { id, name: file.name, type: "text", mimeType: "text/plain", size: file.size, source: "local", textContent: result.value };
        }
        return { id, name: file.name, type: "error", mimeType, size: file.size, source: "local", errorMessage: "DOCX parsing requires mammoth.js. Convert to .txt or .pdf first." };
      }

      try {
        const text = await file.text();
        return { id, name: file.name, type: "text", mimeType: "text/plain", size: file.size, source: "local", textContent: text };
      } catch { return null; }
    }

    function estimateFileTokens(files) {
      return files.reduce((sum, f) => {
        if (f.type === "text")              return sum + Math.ceil((f.textContent?.length || 0) / 4);
        if (f.type === "pdf" || f.type === "image") return sum + Math.ceil((f.size || 0) / 3);
        return sum;
      }, 0);
    }

    async function fetchDriveFile(doc, accessToken) {
      const id       = `gdrive-${doc.id}`;
      const mimeType = doc.mimeType;
      let downloadUrl, effectiveMime = mimeType;

      if (mimeType === "application/vnd.google-apps.document") {
        downloadUrl  = `https://www.googleapis.com/drive/v3/files/${doc.id}/export?mimeType=text/plain`;
        effectiveMime = "text/plain";
      } else if (mimeType === "application/vnd.google-apps.spreadsheet") {
        downloadUrl  = `https://www.googleapis.com/drive/v3/files/${doc.id}/export?mimeType=text/csv`;
        effectiveMime = "text/csv";
      } else {
        downloadUrl = `https://www.googleapis.com/drive/v3/files/${doc.id}?alt=media`;
      }

      const res = await fetch(downloadUrl, { headers: { Authorization: `Bearer ${accessToken}` } });
      if (!res.ok) throw new Error(`Drive API error: ${res.status}`);

      if (effectiveMime.startsWith("image/")) {
        const blob   = await res.blob();
        const base64 = await new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(",")[1]);
          reader.readAsDataURL(blob);
        });
        return { id, name: doc.name, type: "image", mimeType: effectiveMime, size: doc.sizeBytes || 0, source: "gdrive", base64Data: base64 };
      }

      if (effectiveMime === "application/pdf") {
        const blob   = await res.blob();
        const base64 = await new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(",")[1]);
          reader.readAsDataURL(blob);
        });
        return { id, name: doc.name, type: "pdf", mimeType: effectiveMime, size: doc.sizeBytes || 0, source: "gdrive", base64Data: base64 };
      }

      const text = await res.text();
      return { id, name: doc.name, type: "text", mimeType: effectiveMime, size: doc.sizeBytes || 0, source: "gdrive", textContent: text };
    }

    /* ── FILE ATTACHMENT PANEL ───────────────────────────────────────── */

    function GoogleDriveButton({ onAdd }) {
      const [clientId,   setClientId]   = useState(() => localStorage.getItem("council-gdrive-client-id") || "");
      const [showSetup,  setShowSetup]  = useState(false);
      const [loading,    setLoading]    = useState(false);
      const [draftId,    setDraftId]    = useState(() => localStorage.getItem("council-gdrive-client-id") || "");
      const tokenRef = useRef(null);

      const ensureGapiLoaded = () => new Promise((resolve, reject) => {
        if (window.gapi?.client) { resolve(); return; }
        if (!window.gapi)        { reject(new Error("Google API script not loaded yet. Try again in a moment.")); return; }
        window.gapi.load("client:picker", { callback: resolve, onerror: reject });
      });

      const openPicker = async () => {
        if (!clientId) { setShowSetup(true); return; }
        setLoading(true);
        try {
          await ensureGapiLoaded();

          await new Promise((resolve, reject) => {
            const tokenClient = window.google.accounts.oauth2.initTokenClient({
              client_id: clientId,
              scope: "https://www.googleapis.com/auth/drive.readonly",
              callback: (response) => {
                if (response.error) reject(new Error(response.error));
                else { tokenRef.current = response.access_token; resolve(); }
              },
            });
            tokenClient.requestAccessToken({ prompt: tokenRef.current ? "" : "consent" });
          });

          await window.gapi.client.init({});

          const picker = new window.google.picker.PickerBuilder()
            .addView(
              new window.google.picker.DocsView()
                .setIncludeFolders(false)
                .setMimeTypes([
                  "text/plain","application/pdf","text/markdown","application/json","text/csv",
                  "image/png","image/jpeg","image/webp","image/gif",
                  "application/vnd.google-apps.document",
                  "application/vnd.google-apps.spreadsheet",
                ].join(","))
            )
            .setOAuthToken(tokenRef.current)
            .setCallback(async (data) => {
              if (data.action !== window.google.picker.Action.PICKED) return;
              const results = [];
              for (const doc of data.docs) {
                try {
                  const item = await fetchDriveFile(doc, tokenRef.current);
                  if (item) results.push(item);
                } catch (err) { console.error("Drive fetch error:", doc.name, err); }
              }
              if (results.length) onAdd(results);
            })
            .enableFeature(window.google.picker.Feature.MULTISELECT_ENABLED)
            .build();
          picker.setVisible(true);
        } catch (err) {
          alert("Google Drive error: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <>
          <button onClick={openPicker} disabled={loading} className="attach-btn">
            {loading
              ? <i className="ti ti-loader-2 spin" style={{ fontSize: 13 }} />
              : <i className="ti ti-brand-google-drive" style={{ fontSize: 13, color: "var(--green)" }} />
            }
            Drive
          </button>

          {showSetup && (
            <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000 }}
              onClick={e => { if (e.target === e.currentTarget) setShowSetup(false); }}>
              <div style={{ background: "var(--bg2)", border: "1px solid var(--bd)", borderRadius: 10, padding: 28, width: 420, maxWidth: "90vw" }}>
                <p className="tag" style={{ color: "var(--amber)", marginBottom: 8 }}>Google Drive Setup</p>
                <p style={{ fontSize: 13, color: "var(--t2)", lineHeight: 1.7, marginBottom: 16 }}>
                  You need a Google Cloud OAuth 2.0 Client ID. Go to{" "}
                  <strong style={{ color: "var(--t1)" }}>console.cloud.google.com</strong>, enable
                  the Drive API, create a Web Client ID, and add{" "}
                  <strong style={{ color: "var(--t1)" }}>{window.location.origin}</strong> as an
                  authorized JavaScript origin.
                </p>
                <label className="tag" style={{ display: "block", color: "var(--t3)", marginBottom: 6 }}>OAuth Client ID</label>
                <input type="text" value={draftId} onChange={e => setDraftId(e.target.value)}
                  placeholder="xxxx.apps.googleusercontent.com"
                  style={{ width: "100%", padding: "9px 12px", fontSize: 12, fontFamily: "var(--mono)", background: "var(--bg3)", border: "1px solid var(--bd2)", borderRadius: 6, color: "var(--t1)", outline: "none", marginBottom: 14 }} />
                <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
                  <button onClick={() => setShowSetup(false)}
                    style={{ padding: "8px 16px", borderRadius: 6, background: "none", border: "1px solid var(--bd)", color: "var(--t2)", cursor: "pointer" }}>
                    Cancel
                  </button>
                  <button onClick={() => {
                      localStorage.setItem("council-gdrive-client-id", draftId);
                      setClientId(draftId);
                      setShowSetup(false);
                      setTimeout(openPicker, 100);
                    }}
                    style={{ padding: "8px 16px", borderRadius: 6, background: "var(--amber-tint)", border: "1px solid var(--amber-ring)", color: "var(--amber)", cursor: "pointer" }}>
                    Save &amp; Connect
                  </button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    function FileAttachmentPanel({ files, onAdd, onRemove }) {
      const fileInputRef   = useRef(null);
      const folderInputRef = useRef(null);
      const imageInputRef  = useRef(null);

      const handleFiles = async (fileList) => {
        const results = [];
        for (const file of Array.from(fileList)) {
          try {
            const item = await readFileToAttachment(file);
            if (item) results.push(item);
          } catch (err) { console.error("Failed to read file:", file.name, err); }
        }
        if (results.length) onAdd(results);
      };

      const handleFolderUpload = async (fileList) => {
        const usableFiles = Array.from(fileList).filter(f => {
          const path = f.webkitRelativePath || f.name;
          return !path.split("/").some(part =>
            part.startsWith(".") ||
            ["node_modules", "__pycache__", ".git", "dist", "build", ".next", "out", "coverage"].includes(part)
          );
        });

        if (!usableFiles.length) return;

        if (usableFiles.length > 50) {
          if (!window.confirm(
            `This folder contains ${usableFiles.length} readable files after filtering.\nReading all of them may use a lot of tokens. Continue?`
          )) return;
        }

        const results = [];
        for (const file of usableFiles) {
          try {
            const item = await readFileToAttachment(file);
            if (item) {
              item.name = file.webkitRelativePath || file.name;
              results.push(item);
            }
          } catch (err) { console.error("Failed to read:", file.name, err); }
        }
        if (results.length) onAdd(results);
      };

      return (
        <div style={{ marginBottom: 10 }}>
          {/* Hidden file inputs */}
          <input ref={fileInputRef} type="file" multiple
            accept=".txt,.md,.pdf,.docx,.doc,.csv,.json,.html,.xml,.py,.js,.ts,.jsx,.tsx"
            style={{ display: "none" }} onChange={e => { handleFiles(e.target.files); e.target.value = ""; }} />
          <input ref={folderInputRef} type="file" webkitdirectory="" multiple
            style={{ display: "none" }} onChange={e => { handleFolderUpload(e.target.files); e.target.value = ""; }} />
          <input ref={imageInputRef} type="file" multiple accept="image/png,image/jpeg,image/gif,image/webp"
            style={{ display: "none" }} onChange={e => { handleFiles(e.target.files); e.target.value = ""; }} />

          {/* Buttons row */}
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: files.length ? 10 : 0 }}>
            <button onClick={() => fileInputRef.current?.click()} className="attach-btn">
              <i className="ti ti-file-text" style={{ fontSize: 13 }} />Files
            </button>
            <button onClick={() => folderInputRef.current?.click()} className="attach-btn">
              <i className="ti ti-folder" style={{ fontSize: 13 }} />Folder
            </button>
            <button onClick={() => imageInputRef.current?.click()} className="attach-btn">
              <i className="ti ti-photo" style={{ fontSize: 13 }} />Images
            </button>
            <GoogleDriveButton onAdd={onAdd} />
          </div>

          {/* Attached file chips */}
          {files.length > 0 && (
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {files.map(f => (
                <div key={f.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "4px 10px", borderRadius: 20, background: "var(--bg3)", border: "1px solid var(--bd)", fontSize: 11, color: "var(--t2)" }}>
                  <i className={`ti ${fileIcon(f.mimeType)}`} style={{ fontSize: 11, color: f.type === "error" ? "var(--red)" : "var(--amber)" }} />
                  <span style={{ maxWidth: 160, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{f.name}</span>
                  <span style={{ fontSize: 9, color: "var(--t3)", fontFamily: "var(--mono)" }}>{formatFileSize(f.size)}</span>
                  {f.source === "gdrive" && <span style={{ fontSize: 9, color: "var(--blue)", fontFamily: "var(--mono)" }}>DRIVE</span>}
                  {f.type === "error" && (
                    <span style={{ fontSize: 9, color: "var(--red)", fontFamily: "var(--mono)" }} title={f.errorMessage}>ERR</span>
                  )}
                  <button onClick={() => onRemove(f.id)} style={{ background: "none", border: "none", color: "var(--t3)", cursor: "pointer", padding: 0, lineHeight: 1 }}>
                    <i className="ti ti-x" style={{ fontSize: 10 }} />
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function FileTokenWarning({ files }) {
      if (!files.length) return null;
      const tokens  = estimateFileTokens(files);
      const isLarge = tokens > 20000;
      return (
        <p style={{ fontSize: 11, fontFamily: "var(--mono)", color: isLarge ? "var(--amber)" : "var(--t3)", marginBottom: 10 }}>
          {isLarge && <i className="ti ti-alert-triangle" style={{ fontSize: 11, marginRight: 4 }} />}
          ~{tokens.toLocaleString()} tokens from attached files
          {isLarge && " · consider reducing context"}
        </p>
      );
    }

    /* ── ADVISOR PICKER ─────────────────────────────────────────────── */

    function AdvisorPicker({ selected, onChange }) {
      const toggle = (id) => {
        const next = selected.includes(id)
          ? selected.filter(x => x !== id)
          : [...selected, id];
        if (next.length < 2) return;
        onChange(next);
      };

      return (
        <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid var(--bd)" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <p className="tag" style={{ color: "var(--t3)" }}>Advisors</p>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => onChange(ADVISORS.map(a => a.id))}
                style={{ fontSize: 10, color: "var(--t3)", background: "none", border: "none", cursor: "pointer", fontFamily: "var(--mono)", letterSpacing: "1px", textTransform: "uppercase" }}>
                All
              </button>

                  style={{
                    border: `1.5px solid ${isOn ? advisor.ring : "var(--bd)"}`,

                  <i className={`ti ${advisor.icon}`} style={{ fontSize: 12, color: isOn ? advisor.accent : "var(--t3)" }} />
                  <span style={{ fontSize: 11, fontWeight: 500, color: isOn ? "var(--t1)" : "var(--t3)" }}>
                    {advisor.name}
                  </span>
                  {isOn && <i className="ti ti-check" style={{ fontSize: 10, color: advisor.accent }} />}
                </button>

          </div>
          <p style={{ fontSize: 10, color: "var(--t3)", marginTop: 6, fontFamily: "var(--mono)" }}>
            {selected.length} of {ADVISORS.length} advisors · minimum 2 required

        </div>
      );
    }
